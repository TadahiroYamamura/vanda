version = "0.1.0"

[[annotation]]
paths = ["**/*_test.go"]
adapter = "go"
types = ["unit-test", "cross-check", "random-check", "interface-test", "concurrency-test", "sensor"]

[[annotation]]
paths = ["**/*.txtar"]
adapter = "txtar"
types = ["scenario-test"]

[[annotation]]
paths = ["**/*.tla"]
adapter = "tla"
types = ["model-check"]

[[annotation]]
paths = ["web/src/**/*.test.ts", "web/src/**/*.test.tsx"]
adapter = "ts"
types = ["unit-test"]

[story]
adapter = "github"
repository = "TadahiroYamamura/vanda"
id_pattern = "#[0-9]+"

[gui]
base = "main"
