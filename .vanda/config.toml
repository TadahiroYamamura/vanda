version = "0.1.0"

[[layer]]
id = "model"
name = "モデル"
description = "合意の判定の TLA+ のモデル"

[[layer]]
id = "cli"
name = "CLI"
description = "vanda の命令（check・doctor・init・serve の起動）"

[[layer]]
id = "api"
name = "API"
description = "vanda serve の HTTP の API"

[[layer]]
id = "gui"
name = "画面"
description = "画面の部品と、ブラウザーでの操作"

[[annotation]]
paths = ["**/*_test.go"]
adapter = "go"
types = ["unit-test", "cross-check", "random-check", "interface-test", "concurrency-test", "guardrail", "sensor"]

[[annotation]]
paths = ["**/*.txtar"]
adapter = "txtar"
types = ["scenario-test"]

[[annotation]]
paths = ["**/*.tla"]
adapter = "tla"
types = ["model-check"]

[[annotation]]
paths = ["web/src/**/*.test.ts", "web/src/**/*.test.tsx"]
adapter = "ts"
types = ["unit-test"]

[story]
adapter = "github"
repository = "TadahiroYamamura/vanda"
id_pattern = "#[0-9]+"

[gui]
base = "main"

[[annotation]]
paths = ["web/e2e/**/*.spec.ts"]
adapter = "playwright"
types = ["scenario-test"]
