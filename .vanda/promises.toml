[[term]]
id = "evidence-first-development"
name = "エビデンス・ファースト開発"
definition = "AI がソースコードを書き、人はソースコードを読まずに、{@id:promise}と{@id:evidence}で開発を進めるやり方"

[[term]]
id = "vanda"
name = "vanda"
definition = "{@id:evidence-first-development}を支える道具。{@id:promise-list}を持ち、変わったものにレビューで{@id:agreement}し、{@id:promise}が{@id:evidence}で裏付けられているかを{@id:check}する"

[[term]]
id = "software"
name = "ソフトウェア"
definition = "{@id:vanda} で開発するもの。{@id:vanda-dir} を置いた git のリポジトリで作っているもの"

[[term]]
id = "vanda-server"
name = "vanda サーバー"
definition = "vanda serve が起動する Web サーバー。画面と、画面が使う API を出す"

[[term]]
id = "promise-list"
name = "約束リスト"
definition = "{@id:software}について、使う言葉（{@id:term}）、利用者が行う操作（{@id:feature}）、そこで成り立たせると決めたこと（{@id:promise}）をまとめた一覧。{@id:software}の正とする"

[[term]]
id = "promise"
name = "約束"
definition = "{@id:software}が成り立たせると決めたこと"

[[term]]
id = "core-feature"
name = "コア機能"
definition = "失敗すると著しい損害があるので、十分に確かめると決めた{@id:feature}。{@id:promise-list}での項目名は core"

[[term]]
id = "formal-feature"
name = "形式手法を使う機能"
definition = "{@id:oracle}（TLA+）で確かめる{@id:feature}。{@id:promise-list}での項目名は formal。{@id:core-feature}は、理由を書いて{@id:agreement}しない限り形式手法を使う。形式手法を使う{@id:feature}の{@id:promise}は、どれも TLA+ で確かめるか、確かめない理由を書く"

[[term]]
id = "term"
name = "用語"
definition = "ものや概念（例: {@id:agreement-record}、{@id:fingerprint}）。{@id:promise}の対象の 1 つ"

[[term]]
id = "feature"
name = "機能"
definition = "利用者が行う操作（例: {@id:check}の実行）。{@id:promise}の対象の 1 つ"

[[term]]
id = "layer"
name = "レイヤー"
definition = "{@id:promise}が{@id:software}のどの部分の話か"

[[term]]
id = "origin"
name = "変更履歴"
definition = "{@id:promise}が作られたり変わったりした履歴（コミット）"

[[term]]
id = "evidence"
name = "エビデンス"
definition = "{@id:promise}が成り立っていることの裏付け"

[[term]]
id = "stage"
name = "ステージ"
definition = "{@id:evidence}を得る開発の段階。{@id:promise-list}での項目名は stage"
part_of = "evidence"

[[term]]
id = "plan-stage"
name = "計画"
definition = "ソースコードや設定ファイルを編集しなくても得られ、リリースの前に確かめられる{@id:evidence}に{@id:agreement}する段階。例: {@id:promise}、モデル、コードベースを分析した結果（カバレッジ、ホットスポットなど）"
part_of = "stage"

[[term]]
id = "implementation-stage"
name = "実装"
definition = "ソースコードや設定ファイルを足したり、変えたり、消したりして得られ、リリースの前に確かめられる{@id:evidence}に{@id:agreement}する段階。例: 社内に 3 つの案を公開して試した結果"
part_of = "stage"

[[term]]
id = "release-stage"
name = "リリース"
definition = "{@id:software}をリリースする時に確かめられる{@id:evidence}に{@id:agreement}する段階"
part_of = "stage"

[[term]]
id = "operation-stage"
name = "運用"
definition = "リリースした後に、動いている{@id:software}から確かめられる{@id:evidence}に{@id:agreement}する段階。例: {@id:sensor}で確かめた結果"
part_of = "stage"

[[term]]
id = "evidence-type"
name = "タイプ"
definition = "{@id:evidence}の種類。{@id:promise-list}での項目名は type"
part_of = "evidence"

[[term]]
id = "oracle"
name = "オラクル"
definition = "{@id:cross-check}や{@id:random-check}の正解を出すもの。TLA+ のモデルや、{@id:proof}した関数など。{@id:evidence}の{@id:evidence-type}ではない"

[[term]]
id = "model-check"
name = "モデル検査"
definition = "決めた範囲の中のすべての状態をたどって、性質が成り立つことを確かめる（TLC）"
part_of = "evidence-type"

[[term]]
id = "proof"
name = "証明"
definition = "すべての値で性質が成り立つことを示す（Dafny等）"
part_of = "evidence-type"

[[term]]
id = "cross-check"
name = "クロスチェック"
definition = "{@id:oracle}と実装に同じ操作を送り、結果を比べるテスト（モデルベーステスト）"
part_of = "evidence-type"

[[term]]
id = "random-check"
name = "ランダムチェック"
definition = "無作為な入力で性質を確かめるテスト（プロパティベーステスト）"
part_of = "evidence-type"

[[term]]
id = "unit-test"
name = "単体テスト"
definition = "部品を 1 つずつ、決めた入力で動かして確かめるテスト"
part_of = "evidence-type"

[[term]]
id = "interface-test"
name = "インターフェースのテスト"
definition = "DB や CLI などの境界の振る舞いを確かめるテスト"
part_of = "evidence-type"

[[term]]
id = "concurrency-test"
name = "同時実行のテスト"
definition = "複数の操作を同時に行っても、{@id:promise}が成り立つことを確かめるテスト"
part_of = "evidence-type"

[[term]]
id = "human-review"
name = "人のレビュー"
definition = "人が読んで確かめること"
part_of = "evidence-type"

[[term]]
id = "guardrail-evidence"
name = "ガードレールの検証"
definition = "{@id:guardrail}が設定されていて、{@id:promise}に反するものを本当に拒むことの裏付け。{@id:guardrail-definition}と、拒むことを確かめた結果（例: ミューテーションテストの結果）からなる"
part_of = "evidence-type"

[[term]]
id = "sensor-evidence"
name = "センサーの検証"
definition = "{@id:sensor}が実装のコードの中にあり、{@id:promise}が破れた時に本当に見つけて知らせることの裏付け。{@id:sensor-location}と、見つけることを確かめた結果（例: ミューテーションテストの結果）からなる"
part_of = "evidence-type"

[[term]]
id = "scenario"
name = "シナリオ"
definition = "利用者の操作の流れで{@id:promise}を確かめる台本（{@id:evidence}の本体）"

[[term]]
id = "scenario-test"
name = "シナリオテスト"
definition = "{@id:scenario}を動かして確かめるテスト。CLI の txtar、端末で質問するものの Expect、画面の E2E のどれで書いた{@id:scenario}も含む"
part_of = "evidence-type"

[[term]]
id = "guardrail"
name = "ガードレール"
definition = "実装のコードとは別の所で、{@id:promise}に反するものを拒む仕組み。コードを読まない人が確かめられるもの。例: DB の制約・トリガー、ファイルの権限、外との境界のスキーマの検証、サンドボックスや通信の許可の一覧。見つけるだけのもの（{@id:sensor}、テスト）は含めない"

[[term]]
id = "guardrail-definition"
name = "ガードレールの定義"
definition = "{@id:guardrail}を設定として書いたファイル。例: IaC の設定ファイル、DB のスキーマ"

[[term]]
id = "sensor"
name = "センサー"
definition = "実装のコードの中で、操作の後に{@id:promise}が成り立っているかを確かめ、破れていたら見つけて知らせる仕組み（事後条件の確認）。拒むのではなく見つける。例: 操作の後の状態を確かめ、破れていればエラーを返して記録する。実装のコードの外で拒むものは{@id:guardrail}、開発中に確かめるものはテスト"

[[term]]
id = "sensor-location"
name = "センサーの場所"
definition = "{@id:sensor}がある、実装のコードの中の場所。sensor の{@id:annotation}で示す"

[[term]]
id = "story"
name = "ストーリー"
definition = "開発の単位。{@id:story-store}（GitHub Issues など）で管理する"

[[term]]
id = "agreement"
name = "承認"
definition = "{@id:promise}などの今の中身が要求どおりかを人が確かめ、認めること。動作は「承認する」"

[[term]]
id = "agreement-record"
name = "承認の記録"
definition = "{@id:agreement}を書き留めたもの。{@id:promise}・{@id:term}・{@id:feature}なら ID と中身の{@id:fingerprint}の組、ファイルならファイルパスと中身の{@id:fingerprint}の組ごとに、誰が・いつ・どの{@id:story}で{@id:agreement}したかを書く。{@id:promise-list}とは別のファイルに置く"

[[term]]
id = "proposed"
name = "提案中"
definition = "今の中身に、まだ{@id:agreement}していない状態。一度も{@id:agreement}していないものと、前の{@id:agreement}から中身が変わったものの両方を含む"

[[term]]
id = "agreed"
name = "承認済"
definition = "今の中身に{@id:agreement}している状態"

[[term]]
id = "base-branch"
name = "ベースブランチ"
definition = "差分を出す時に比べるブランチ。そのブランチとの{@id:branch-point}と比べる"

[[term]]
id = "ai-proposal"
name = "AI 案"
definition = "要求にも質疑にもなく、AI が自分で決めたもの"
part_of = "flag"

[[term]]
id = "guess"
name = "推測"
definition = "AI が確かめずに推し量って書いた所があるもの"
part_of = "flag"

[[term]]
id = "changed-since-agreement"
name = "差分あり"
definition = "前の{@id:agreement}から中身が変わったもの"
part_of = "flag"

[[term]]
id = "check"
name = "チェック"
definition = "CLI の vanda check が、{@id:promise-list}・{@id:annotation}・{@id:story-trailer}・{@id:agreement}・{@id:evidence-plan}などを読んで、間違いや矛盾がなく基準を満たすかを判断すること"

[[term]]
id = "promise-list-shape-check"
name = "約束リストの形のチェック"
definition = "{@id:promise-list}が決まった形で書かれているかを確かめる{@id:check}。{@id:check-config}に書く名前は promise-list-shape"
part_of = "check"

[[term]]
id = "annotation-links-check"
name = "アノテーションのつながりのチェック"
definition = "{@id:annotation}が、{@id:promise-list}にある{@id:term}・{@id:feature}・{@id:promise}を正しく指しているかを確かめる{@id:check}。{@id:check-config}に書く名前は annotation-links"
part_of = "check"

[[term]]
id = "story-origin-check"
name = "コミットのストーリーのチェック"
definition = "{@id:promise-list}を変えたコミットが、どの{@id:story}のものか分かるかを確かめる{@id:check}。{@id:check-config}に書く名前は story-origin"
part_of = "check"

[[term]]
id = "agreement-check"
name = "承認のチェック"
definition = "{@id:agreement}の対象の今の中身に、PO が{@id:agreement}しているかを確かめる{@id:check}。{@id:check-config}に書く名前は agreement"
part_of = "check"

[[term]]
id = "agreement-targets-check"
name = "承認の記録の指す先のチェック"
definition = "{@id:agreement-record}が、{@id:promise-list}にあるものを指しているかを確かめる{@id:check}。{@id:check-config}に書く名前は agreement-targets"
part_of = "check"

[[term]]
id = "evidence-present-check"
name = "エビデンス完備のチェック"
definition = "{@id:promise}に予定した{@id:evidence}が揃っているかを確かめる{@id:check}。{@id:check-config}に書く名前は evidence-present"
part_of = "check"

[[term]]
id = "unread-files-check"
name = "読まれていないファイルのチェック"
definition = "{@id:vanda-dir} に、{@id:vanda} が読まないファイルが置かれていないかを確かめる{@id:check}。{@id:check-config}に書く名前は unread-files"
part_of = "check"

[[term]]
id = "mistake"
name = "誤り"
definition = "人が書いたもの（設定・{@id:promise-list}・{@id:agreement-record}・{@id:annotation}・コマンドの引数など）の間違いで、{@id:vanda} が見つけて知らせるもの。例: 設定の誤り、{@id:promise-list}の形の誤り、{@id:check}で見つかった誤り"

[[term]]
id = "error"
name = "エラー"
definition = "{@id:vanda} や、{@id:vanda} が呼んだもの（{@id:adapter}・git・{@id:story-store}など）が、処理を続けられずに失敗すること。0 以外の終了コードや、API の 4xx・5xx で返す。例: {@id:adapter}が 0 以外で終わった、GitHub に繋がらない"

[[term]]
id = "flag"
name = "フラグ"
definition = "注意して読む手がかりとして、{@id:promise}などに立てるもの"

[[term]]
id = "annotation"
name = "アノテーション"
definition = "仕様・テスト・本番のコードに書く注釈。{@id:promise}などの ID を指す（例: @vanda:evidence <{@id:promise}の ID>）"

[[term]]
id = "adapter"
name = "アダプタ"
definition = "{@id:vanda} と、言語や道具・{@id:story-store}・{@id:guardrail-definition}とのあいだで受け渡しをする部品"

[[term]]
id = "builtin-adapter"
name = "組み込みのアダプタ"
definition = "{@id:vanda} が中に持つ{@id:adapter}"
part_of = "adapter"

[[term]]
id = "custom-adapter"
name = "カスタムアダプタ"
definition = "利用者が{@id:adapter-dir}に置いた{@id:adapter}"
part_of = "adapter"

[[term]]
id = "fingerprint"
name = "フィンガープリント"
definition = "中身が同じかを比べるための値。{@id:agreement-record}は、{@id:agreement}した時のフィンガープリントを持つ"

[[term]]
id = "story-store"
name = "ストーリーストア"
definition = "{@id:story}を書いて置いておく所。例: GitHub Issues。{@id:vanda} はここから{@id:story}を読む"

[[term]]
id = "story-trailer"
name = "Story: のトレーラー"
definition = "コミットのメッセージの末尾に書く Story: <ID>（Co-Authored-By: と同じ Git のトレーラー）。そのコミットがどの{@id:story}のものかを表す"

[[term]]
id = "reference"
name = "参照"
definition = "{@id:promise-list}の文の中で、ほかの{@id:term}・{@id:feature}・{@id:promise}を ID で指したもの"

[[term]]
id = "vanda-dir"
name = ".vanda/"
definition = "{@id:vanda} が読み書きするファイルを置く、リポジトリの直下のディレクトリ（.vanda/）"

[[term]]
id = "config-file"
name = "設定のファイル"
definition = "{@id:vanda} の設定を書いたファイル（.vanda/config.toml）"
part_of = "vanda-dir"

[[term]]
id = "default-promise-list-file"
name = "約束リストの既定のファイル"
definition = "設定に promises を書かない時に、{@id:promise-list}として読むファイル（.vanda/promises.toml）"
part_of = "vanda-dir"

[[term]]
id = "default-agreement-record-file"
name = "承認の記録の既定のファイル"
definition = "設定に agreements を書かない時に、{@id:agreement-record}として読み書きするファイル（.vanda/agreements.toml）"
part_of = "vanda-dir"

[[term]]
id = "check-config-dir"
name = "チェックの設定のディレクトリ"
definition = "{@id:check-config}を <名前>.toml という名前で置くディレクトリ（.vanda/checks/）"
part_of = "vanda-dir"

[[term]]
id = "adapter-dir"
name = "アダプタのディレクトリ"
definition = "{@id:custom-adapter}を置くディレクトリ（.vanda/adapters/）"
part_of = "vanda-dir"

[[term]]
id = "check-config"
name = "チェックの設定"
definition = "vanda check で行う{@id:check}の種類と{@id:check-scope}を定義するファイル"

[[term]]
id = "check-scope"
name = "スコープ"
definition = "{@id:check}で確認する範囲"

[[term]]
id = "branch-point"
name = "マージベース"
definition = "今のブランチが{@id:base-branch}から分かれたコミット"

[[term]]
id = "detached"
name = "失効した承認"
definition = "{@id:story}が{@id:agreement}したことがあり、今の中身にその{@id:story}の{@id:agreement}がないもの。誰が変えたかを問わない"

[[term]]
id = "evidence-plan"
name = "エビデンスの予定"
definition = "{@id:promise}ごとに、どの{@id:stage}で、どの{@id:evidence-type}の{@id:evidence}を、どの{@id:layer}で得るかを書いたもの（{@id:promise-list}の項目は evidence）"

[[feature]]
id = "start-server"
name = "vanda サーバーを起動する（vanda serve）"
definition = "{@id:vanda-server}を起動し、画面をブラウザで開く"

[[feature]]
id = "read-promise-list"
name = "約束リストを読む"
definition = "{@id:promise-list}を読み、形を確かめる"

[[feature]]
id = "show-references"
name = "参照を、指す先が分かる形で見せる"
definition = "{@id:promise-list}の文の中の{@id:reference}を、指す先が分かる形で見せる"

[[feature]]
id = "store-agreements"
name = "承認の記録を読み書きする"
definition = "{@id:agreement-record}を読み書きする"

[[feature]]
id = "build-origins"
name = "変更履歴を作る"
definition = "{@id:promise}ごとの{@id:origin}を作る"

[[feature]]
id = "choose-base-branch"
name = "ベースブランチを選ぶ"
definition = "比べる{@id:base-branch}を、画面でその場で選ぶ"

[[feature]]
id = "connect-story-store"
name = "ストーリーストアと連携する"
definition = "{@id:story-store}から、{@id:story}を読む"

[[feature]]
id = "store-config"
name = "設定をファイルに書く"
definition = "設定をファイルに持つ"

[[feature]]
id = "list-changes"
name = "ストーリーで変わったものを並べる"
definition = "比べる元と今のあいだで変わったものの一覧を示す"

[[feature]]
id = "number-changes"
name = "通し番号と総数を示す"
definition = "一覧に通し番号と総数を示す"

[[feature]]
id = "raise-flags"
name = "フラグを立てる"
definition = "注意して読む手がかりとして、{@id:flag}を立てる"

[[feature]]
id = "compare-contents"
name = "変更前と変更後の中身を比べる"
definition = "変更・削除したものの、変更前と変更後の中身と差分を示す"

[[feature]]
id = "agree-on-review"
name = "レビューで承認する"
definition = "{@id:story}のレビューで、1 件に{@id:agreement}する"
core = true
formal = true

[[feature]]
id = "show-evidence-status"
name = "エビデンスの予定と実際を示す"
definition = "{@id:evidence-plan}ごとに、揃っているかを示す"

[[feature]]
id = "fold-groups"
name = "長い一覧をたたむ"
definition = "一覧をまとまりごとにたたむ"

[[feature]]
id = "switch-review-unit"
name = "レビュー単位を切り替える"
definition = "レビュー単位を切り替える"

[[feature]]
id = "show-detached"
name = "失効した承認を示す"
definition = "{@id:detached}を示す"

[[feature]]
id = "show-entry-history"
name = "1 件の詳細に変更履歴と承認の履歴を示す"
definition = "レビューの 1 件の詳細に、{@id:promise}の{@id:origin}と{@id:agreement}の履歴を示す"

[[feature]]
id = "revoke-agreement"
name = "承認を取り消す"
definition = "{@id:agreement}を取り消す"
core = true
formal = true

[[feature]]
id = "agree-on-detail-pages"
name = "約束の詳細とファイルの画面で承認する"
definition = "レビューの画面のほか、{@id:promise}の詳細の画面とファイルの画面でも、1 件に{@id:agreement}し、{@id:agreement}を取り消す"

[[feature]]
id = "show-term-feature-pages"
name = "用語と機能の詳細を示す"
definition = "{@id:term}と{@id:feature}ごとに、その中身と、それを対象に持つ{@id:promise}を、1 つのページに示す"

[[feature]]
id = "show-claim-fields"
name = "約束の文・理由・条件・レイヤーを示す"
definition = "{@id:promise}の詳細に、{@id:promise}の中身を示す"

[[feature]]
id = "show-claim-evidence"
name = "約束のエビデンスを示す"
definition = "{@id:promise}の詳細に、{@id:evidence}を示す"

[[feature]]
id = "show-claim-origin"
name = "約束の変更履歴を示す"
