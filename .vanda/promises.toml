[[term]]
id = "evidence-first-development"
name = "エビデンス・ファースト開発"
definition = "AI がソースコードを書き、人はソースコードを読まずに、約束とエビデンスで開発を進めるやり方"

[[term]]
id = "promise-list"
name = "約束リスト"
definition = "約束・用語・機能をまとめた一覧（quenta では spec/assurance.toml。quenta の規則では「保証の台帳」）"

[[term]]
id = "promise"
name = "約束"
definition = "ソフトウェアが成り立たせると決めたこと（quenta の規則では「主張」）"

[[term]]
id = "core-feature"
name = "コア機能"
definition = "失敗すると著しい損害があるので、十分に確かめると決めた機能。約束リストの項目は core"

[[term]]
id = "formal-feature"
name = "形式手法を使う機能"
definition = "オラクル（TLA+）で確かめる機能。約束リストの項目は formal。コア機能は、理由を書いて合意しない限り形式手法を使う"

[[term]]
id = "term"
name = "用語"
definition = "ものや概念（例: タスク、タスクの ID）。約束の対象の 1 つ"

[[term]]
id = "feature"
name = "機能"
definition = "利用者が行う操作（例: タスクの登録）。約束の対象の 1 つ"

[[term]]
id = "layer"
name = "レイヤー"
definition = "約束がソフトウェアのどの部分の話か。モデル（判定と状態の変化）・CLI（引数と出力の形）・DB（保存）"

[[term]]
id = "origin"
name = "由来"
definition = "約束が作られ・変わった履歴。1 件ごとに、ストーリーと、そのきっかけになった判断を結ぶ（「出どころ」はこれにまとめた）"

[[term]]
id = "evidence"
name = "エビデンス"
definition = "約束が成り立っていることの裏付け（quenta の規則では「裏付け」）"

[[term]]
id = "stage"
name = "ステージ"
definition = "エビデンスを得る開発の段階。計画・実装・テスト・リリース・運用。約束リストの項目は stage"
part_of = "evidence"

[[term]]
id = "evidence-type"
name = "タイプ"
definition = "エビデンスの種類（オラクル、クロスチェック、シナリオなど）。約束リストの項目は type"
part_of = "evidence"

[[term]]
id = "oracle"
name = "オラクル"
definition = "クロスチェックやランダムチェックの正解を出すもの。TLA+ のモデルや、証明した関数など。エビデンスのタイプではない"

[[term]]
id = "model-check"
name = "モデル検査"
definition = "エビデンスのタイプ（model-check）。決めた範囲の中のすべての状態をたどって、性質が成り立つことを確かめる（TLC）"

[[term]]
id = "proof"
name = "証明"
definition = "エビデンスのタイプ（proof）。すべての値で性質が成り立つことを示す（Dafny）"

[[term]]
id = "oracle-reading"
name = "読み下し"
definition = "オラクルを自然言語に訳したもの（quenta の規則では「逆翻訳」）"

[[term]]
id = "cross-check"
name = "クロスチェック"
definition = "オラクルと実装に同じ操作を送り、結果を比べるテスト（モデルベーステスト）。タイプの値は cross-check"

[[term]]
id = "random-check"
name = "ランダムチェック"
definition = "無作為な入力で性質を確かめるテスト（プロパティベーステスト）"

[[term]]
id = "decoy-test"
name = "デコイテスト"
definition = "わざと不具合を仕込み、テストが捕まえるかを試すもの（変異テスト）"

[[term]]
id = "no-catch-reason"
name = "キャッチしない理由"
definition = "デコイテストで、テストがキャッチしないデコイと、その理由の一覧。1 件ごとに理由の種類と文を持つ（「対象外」から改名した）"
part_of = "decoy-test"

[[term]]
id = "equivalent-decoy"
name = "等価デコイ"
definition = "仕込んでも振る舞いが変わらないデコイ（等価ミュータントにあたる）。どんなテストでもキャッチできない"

[[term]]
id = "out-of-promise-decoy"
name = "約束外デコイ"
definition = "約束していない振る舞いだけを変えるデコイ（例: エラーの文言）。キャッチするテストを書けるが、書かない"

[[term]]
id = "catch-rate"
name = "キャッチ率"
definition = "デコイテストで、仕込んだ不具合のうちテストが捕まえた割合（検出力）"

[[term]]
id = "scenario"
name = "シナリオ"
definition = "CLI のコマンドの並びで約束を確かめる台本（エビデンスの本体）"

[[term]]
id = "scenario-test"
name = "シナリオテスト"
definition = "シナリオを動かして確かめるエビデンスのタイプ（scenario-test。E2E テスト）"

[[term]]
id = "guardrail"
name = "ガードレール"
definition = "実装のコードとは別の所で、約束に反するものを拒む仕組み。コードを読まない人が確かめられるもの。例: DB の制約・トリガー、ファイルの権限、外との境界のスキーマの検証、サンドボックスや通信の許可の一覧。見つけるだけのもの（センサー、テスト）は含めない"

[[term]]
id = "sensor"
name = "センサー"
definition = "実装のコードの中で、操作の後に約束が成り立っているかを確かめ、破れていたら見つけて知らせる仕組み（事後条件の確認）。拒むのではなく見つける。例: 操作の後の状態を確かめ、破れていればエラーを返して記録する。実装のコードの外で拒むものはガードレール、開発中に確かめるものはテスト"

[[term]]
id = "run-result"
name = "実行の結果"
definition = "エビデンスを実行したときの、日時・版・合格したか・ログ"

[[term]]
id = "run-trace"
name = "実行の記録"
definition = "ランダムチェックとクロスチェックで、実際に流した値と結果"
part_of = "run-result"

[[term]]
id = "story"
name = "ストーリー"
definition = "開発の単位。ストーリーの置き場所（GitHub Issues など）で管理する"

[[term]]
id = "agreement"
name = "合意"
definition = "約束などの今の中身が要求どおりかを人が確かめ、認めること。動作は「合意する」（「了承」から改名した）"

[[term]]
id = "agreement-record"
name = "合意の記録"
definition = "合意を、対象の鍵と中身の指紋の組に対して、誰が（合意したときの git の user.name と user.email）・いつ・どのストーリーで合意したかとともに書いたもの。約束リストとは別のファイルに置く"

[[term]]
id = "proposed"
name = "提案中"
definition = "今の中身に、まだ合意していない状態。一度も合意していないものと、前の合意から中身が変わったものの両方を含む"

[[term]]
id = "agreed"
name = "合意済"
definition = "今の中身に合意している状態"

[[term]]
id = "base-branch"
name = "ベースブランチ"
definition = "差分を出すときに比べるブランチ。ブランチごとのレビュー（RV-13）では、そのブランチが分かれた点と比べる。画面でその場で選ぶ（「比べる元」から改名した）"

[[term]]
id = "ai-proposal"
name = "AI 案"
definition = "フラグ（注意して読む手がかり）。要求にも質疑にもなく、AI が自分で決めたもの"

[[term]]
id = "guess"
name = "推測"
definition = "フラグ（注意して読む手がかり）。AI が確かめずに書いた事実を含むもの"

[[term]]
id = "changed-since-agreement"
name = "差分あり"
definition = "フラグ（注意して読む手がかり）。前の合意から中身が変わったもの"

[[term]]
id = "basis"
name = "根拠"
definition = "調査やインタビューで分かり、判断の根拠にしたこと"

[[term]]
id = "decision"
name = "判断"
definition = "決めたこと。合意、差し戻し、方針の決定"

[[term]]
id = "blocker"
name = "阻害要因"
definition = "判断できない理由と、何が分かれば判断できるか"

[[term]]
id = "send-back"
name = "差し戻し"
definition = "「このままでは合意しない」という判断"

[[term]]
id = "sent-back"
name = "差し戻し中"
definition = "最後の判断が差し戻しで、まだ直していない状態"

[[term]]
id = "waiting"
name = "待機中"
definition = "エージェントが、レビュー・質問への回答・入力を待っている状態"

[[term]]
id = "interrupt"
name = "中断"
definition = "エージェントの今の作業だけを止めること（コンソールで Esc を押すのに当たる）"

[[term]]
id = "check"
name = "審査"
definition = "CLI の vanda check が行う、約束リスト・合意・エビデンス・オラクルなどの点検。証拠を見て、間違いや矛盾がなく基準を満たすかを判断する（「確かめ」から改名した）"

[[term]]
id = "export"
name = "エクスポート"
definition = "読み取り専用の頁を作ること"

[[term]]
id = "flag"
name = "フラグ"
definition = "注意して読む手がかりとして、約束などに立てるもの。AI 案・推測・差分あり"

[[term]]
id = "annotation"
name = "アノテーション"
definition = "仕様・テスト・本番のコードに書く注釈。約束などの ID を指す（例: @vanda:evidence <約束の ID>）。quenta の規則では「印」"

[[term]]
id = "adapter"
name = "アダプタ"
definition = "vanda と、言語や道具・ストーリーの置き場所とのあいだを受け渡す部品。vanda が組込みで持つもの（組込みのアダプタ）と、プロジェクトが .vanda/adapters/ に置くものがある"

[[term]]
id = "builtin-adapter"
name = "組込みのアダプタ"
definition = "vanda が中に持つアダプタ（アノテーションの go・txtar・tla・sql・ts、ストーリーの置き場所の github）。同じ名前のアダプタを .vanda/adapters/ に置くと、そちらが使われる"

[[feature]]
id = "cm-01"
name = "手元のサーバーの起動（vanda serve）"
definition = "手元のサーバーを起動し、ブラウザで開く。自分のマシンの中でだけ開く（CM-01・CMD-04）"

[[feature]]
id = "cm-02"
name = "約束リストを読む"
definition = "約束リスト（設定の promises のパターンに当たるファイル）を読み、形を確かめる（CM-02）"

[[feature]]
id = "cm-03"
name = "合意の記録を読み書きする"
definition = "約束リストとは別のファイルの合意の記録を読み書きする。合意ごとに、中身の指紋・日時・ストーリーの ID・合意した人を持つ（CM-03）"

[[feature]]
id = "cm-05"
name = "由来"
definition = "git の履歴から、約束ごとの由来（約束が作られ・変わったコミット）を作る（CM-05 のうち、判断の記録を結ぶところを除く）"

[[feature]]
id = "cm-06"
name = "ベースブランチを選ぶ"
definition = "比べるベースブランチを、画面でその場で選ぶ。開いたときの既定は設定のベースブランチ（CM-06）"

[[feature]]
id = "cm-08"
name = "ストーリーの置き場所と連携する"
definition = "ストーリーの置き場所から、ストーリーの題・本文・添付ファイルを読む。置き場所はアダプタで差し替えられる（CM-08 のうち、読むところ）"

[[feature]]
id = "cm-09"
name = "設定のファイル"
definition = "設定を .vanda/config.toml に持つ。画面で書き換える機能は作らない。認証の鍵はファイルに書かない（CM-09）"

[[feature]]
id = "rv-01"
name = "ストーリーで変わったものの一覧"
definition = "比べる元と今のあいだで追加・変更・削除された約束・用語・機能とエビデンスの本体の一覧を、漏れも重複もなく示す（RV-01）"

[[feature]]
id = "rv-02"
name = "通し番号と総数"
definition = "一覧に通し番号と総数を示す（RV-02）"

[[feature]]
id = "rv-04"
name = "フラグ"
definition = "注意して読む手がかりとして、AI 案・推測・差分ありのフラグを立てる（RV-04）"

[[feature]]
id = "rv-05"
name = "変更前と変更後の中身"
definition = "変更・削除したものの、変更前と変更後の中身と差分を示す（RV-05）"

[[feature]]
id = "rv-06"
name = "合意する"
definition = "1 件に合意し、合意の記録を書いてコミットする（RV-06）"
core = true
formal = true

[[feature]]
id = "rv-08"
name = "エビデンスの予定と実際"
definition = "エビデンスの予定ごとに、揃っているかを示す（RV-08 のうち、合格したかを除く）"

[[feature]]
id = "rv-10"
name = "長い一覧をたたむ"
definition = "一覧をまとまりごとにたたみ、たたんだ件数を示す（RV-10）"

[[feature]]
id = "rv-13"
name = "レビュー単位"
definition = "レビュー単位をブランチとストーリーで切り替える（RV-13）"

[[feature]]
id = "rv-14"
name = "外れた合意"
definition = "ストーリーが前に合意したのに今の中身にそのストーリーの合意がないものを、「合意が外れた」と示す（RV-14 のうち、エージェントへの知らせを除く）"

[[feature]]
id = "rv-16"
name = "1 件の詳細の由来と合意の履歴"
definition = "レビューの 1 件の詳細に、約束の由来と合意の履歴を示す（RV-16）"

[[feature]]
id = "rv-17"
name = "合意を取り消す"
definition = "今の人が今のブランチで書いた合意の記録を消し、コミットする（RV-17）"
core = true
formal = true

[[feature]]
id = "rv-18"
name = "約束の詳細とファイルの画面での合意"
definition = "約束の詳細の画面と、ファイルの画面でも、合意する・合意を取り消す（RV-18）"

[[feature]]
id = "cl-01"
name = "約束の文・理由・条件・レイヤー"
definition = "約束の詳細に、文・理由・条件・レイヤーを示す（CL-01）"

[[feature]]
id = "cl-02"
name = "約束のエビデンス"
definition = "約束の詳細に、エビデンスをステージとタイプで分けて、その中身とともに示す（CL-02）"

[[feature]]
id = "cl-04"
name = "約束の由来"
definition = "約束の詳細に、由来を示す（CL-04）"

[[feature]]
id = "cl-05"
name = "約束の合意の履歴"
definition = "約束の詳細に、合意の履歴を示す（CL-05）"

[[feature]]
id = "cl-07"
name = "TLA+ の記号"
definition = "オラクルの定義（TLA+）を数学の記号で見せ、コピーしたときはリポジトリの文字のままにする（CL-07）"

[[feature]]
id = "cl-08"
name = "その時点の約束の中身"
definition = "由来のコミットや合意の記録を選ぶと、その時点の約束の中身を示す（CL-08）"

[[feature]]
id = "cmd-01"
name = "設定とつながりを確かめる（vanda doctor）"
definition = "今効いている設定と版と、ストーリーの置き場所につながるかを確かめる（CMD-01 のうち、結果を取ってくる元を除く）"

[[feature]]
id = "cmd-03"
name = "審査を行う（vanda check）"
definition = "審査の設定のファイルに並べた審査を行う（CMD-03）"

[[feature]]
id = "cmd-10"
name = "審査の種類"
definition = "約束リストの形・アノテーションのつながり・由来・合意・合意の記録の指す先・エビデンスが揃っている・読まれていないファイルの審査（CMD-10 のうち、実行の結果・キャッチしない理由・モデル検査の審査を除く）"

[[feature]]
id = "cmd-11"
name = ".vanda/ を作る（vanda init）"
definition = "端末で問いかけ、答えで設定・約束リスト・合意の記録・審査の設定を作る（CMD-11）"

[[feature]]
id = "show-version"
name = "版を出す（vanda version）"
definition = "動いている vanda の版を出す"

[[feature]]
id = "annotation-reading"
name = "アノテーションの読み取り"
definition = "設定のパターンに当たるファイルから、アダプタでアノテーションと、付いているものの名前を読む"

[[feature]]
id = "project-adapters"
name = ".vanda/adapters/ のアダプタ"
definition = "プロジェクトが .vanda/adapters/ に置いたアダプタを、設定に書いた名前で動かす"

[[claim]]
id = "promise-list-reads-all-patterns"
