[[term]]
id = "evidence-first-development"
name = "エビデンス・ファースト開発"
definition = "AI がソースコードを書き、人はソースコードを読まずに、約束とエビデンスで開発を進めるやり方"

[[term]]
id = "vanda"
name = "vanda"
definition = "エビデンス・ファースト開発を支える道具。約束リストを持ち、変わったものにレビューで合意し、約束がエビデンスで裏付けられているかを審査する"

[[term]]
id = "software"
name = "ソフトウェア"
definition = "vanda で開発するもの。.vanda/ を置いた git のリポジトリで作っているもの"

[[term]]
id = "vanda-server"
name = "vanda サーバー"
definition = "vanda serve が起動する Web サーバー。画面と、画面が使う API を出す"

[[term]]
id = "promise-list"
name = "約束リスト"
definition = "ソフトウェアについて、使う言葉（用語）、利用者が行う操作（機能）、そこで成り立たせると決めたこと（約束）をまとめた一覧。ソフトウェアの正とする"

[[term]]
id = "promise"
name = "約束"
definition = "ソフトウェアが成り立たせると決めたこと"

[[term]]
id = "core-feature"
name = "コア機能"
definition = "失敗すると著しい損害があるので、十分に確かめると決めた機能。約束リストでの項目名は core"

[[term]]
id = "formal-feature"
name = "形式手法を使う機能"
definition = "オラクル（TLA+）で確かめる機能。約束リストでの項目名は formal。コア機能は、理由を書いて合意しない限り形式手法を使う。形式手法を使う機能の約束は、どれも TLA+ で確かめるか、確かめない理由を書く"

[[term]]
id = "term"
name = "用語"
definition = "ものや概念（例: 合意の記録、指紋）。約束の対象の 1 つ"

[[term]]
id = "feature"
name = "機能"
definition = "利用者が行う操作（例: 審査の実行）。約束の対象の 1 つ"

[[term]]
id = "layer"
name = "レイヤー"
definition = "約束がソフトウェアのどの部分の話か"

[[term]]
id = "origin"
name = "由来"
definition = "約束が作られたり変わったりした履歴（コミット）"

[[term]]
id = "evidence"
name = "エビデンス"
definition = "約束が成り立っていることの裏付け"

[[term]]
id = "stage"
name = "ステージ"
definition = "エビデンスを得る開発の段階。約束リストでの項目名は stage"
part_of = "evidence"

[[term]]
id = "plan-stage"
name = "計画"
definition = "ソースコードや設定ファイルを編集しなくても得られ、リリースの前に確かめられるエビデンスに合意する段階。例: 約束、モデル、コードベースを分析した結果（カバレッジ、ホットスポットなど）"
part_of = "stage"

[[term]]
id = "implementation-stage"
name = "実装"
definition = "ソースコードや設定ファイルを足したり、変えたり、消したりして得られ、リリースの前に確かめられるエビデンスに合意する段階。例: 社内に 3 つの案を公開して試した結果"
part_of = "stage"

[[term]]
id = "release-stage"
name = "リリース"
definition = "ソフトウェアをリリースする時に確かめられるエビデンスに合意する段階"
part_of = "stage"

[[term]]
id = "operation-stage"
name = "運用"
definition = "リリースした後に、動いているソフトウェアから確かめられるエビデンスに合意する段階。例: センサーで確かめた結果"
part_of = "stage"

[[term]]
id = "evidence-type"
name = "タイプ"
definition = "エビデンスの種類。約束リストでの項目名は type"
part_of = "evidence"

[[term]]
id = "oracle"
name = "オラクル"
definition = "クロスチェックやランダムチェックの正解を出すもの。TLA+ のモデルや、証明した関数など。エビデンスのタイプではない"

[[term]]
id = "model-check"
name = "モデル検査"
definition = "決めた範囲の中のすべての状態をたどって、性質が成り立つことを確かめる（TLC）"
part_of = "evidence-type"

[[term]]
id = "proof"
name = "証明"
definition = "すべての値で性質が成り立つことを示す（Dafny等）"
part_of = "evidence-type"

[[term]]
id = "cross-check"
name = "クロスチェック"
definition = "オラクルと実装に同じ操作を送り、結果を比べるテスト（モデルベーステスト）"
part_of = "evidence-type"

[[term]]
id = "random-check"
name = "ランダムチェック"
definition = "無作為な入力で性質を確かめるテスト（プロパティベーステスト）"
part_of = "evidence-type"

[[term]]
id = "unit-test"
name = "単体テスト"
definition = "部品を 1 つずつ、決めた入力で動かして確かめるテスト"
part_of = "evidence-type"

[[term]]
id = "interface-test"
name = "インターフェースのテスト"
definition = "DB や CLI などの境界の振る舞いを確かめるテスト"
part_of = "evidence-type"

[[term]]
id = "concurrency-test"
name = "同時実行のテスト"
definition = "複数の操作を同時に行っても、約束が成り立つことを確かめるテスト"
part_of = "evidence-type"

[[term]]
id = "human-review"
name = "人のレビュー"
definition = "人が読んで確かめること"
part_of = "evidence-type"

[[term]]
id = "guardrail-evidence"
name = "ガードレールの検証"
definition = "ガードレールが設定されていて、約束に反するものを本当に拒むことの裏付け。ガードレールの定義と、拒むことを確かめた結果（例: ミューテーションテストの結果）からなる"
part_of = "evidence-type"

[[term]]
id = "sensor-evidence"
name = "センサーの検証"
definition = "センサーが実装のコードの中にあり、約束が破れた時に本当に見つけて知らせることの裏付け。センサーの場所と、見つけることを確かめた結果（例: ミューテーションテストの結果）からなる"
part_of = "evidence-type"

[[term]]
id = "scenario"
name = "シナリオ"
definition = "利用者の操作の流れで約束を確かめる台本（エビデンスの本体）"

[[term]]
id = "scenario-test"
name = "シナリオテスト"
definition = "シナリオを動かして確かめるテスト。CLI の txtar、端末で問いかけるものの Expect、画面の E2E のどれで書いたシナリオも含む"
part_of = "evidence-type"

[[term]]
id = "guardrail"
name = "ガードレール"
definition = "実装のコードとは別の所で、約束に反するものを拒む仕組み。コードを読まない人が確かめられるもの。例: DB の制約・トリガー、ファイルの権限、外との境界のスキーマの検証、サンドボックスや通信の許可の一覧。見つけるだけのもの（センサー、テスト）は含めない"

[[term]]
id = "guardrail-definition"
name = "ガードレールの定義"
definition = "ガードレールを設定として書いたファイル。例: IaC の設定ファイル、DB のスキーマ"

[[term]]
id = "sensor"
name = "センサー"
definition = "実装のコードの中で、操作の後に約束が成り立っているかを確かめ、破れていたら見つけて知らせる仕組み（事後条件の確認）。拒むのではなく見つける。例: 操作の後の状態を確かめ、破れていればエラーを返して記録する。実装のコードの外で拒むものはガードレール、開発中に確かめるものはテスト"

[[term]]
id = "sensor-location"
name = "センサーの場所"
definition = "センサーがある、実装のコードの中の場所。sensor のアノテーションで示す"

[[term]]
id = "story"
name = "ストーリー"
definition = "開発の単位。ストーリーストア（GitHub Issues など）で管理する"

[[term]]
id = "agreement"
name = "合意"
definition = "約束などの今の中身が要求どおりかを人が確かめ、認めること。動作は「合意する」"

[[term]]
id = "agreement-record"
name = "合意の記録"
definition = "合意を書き留めたもの。約束・用語・機能なら ID と中身の指紋の組、ファイルならファイルパスと中身の指紋の組ごとに、誰が・いつ・どのストーリーで合意したかを書く。約束リストとは別のファイルに置く"

[[term]]
id = "proposed"
name = "提案中"
definition = "今の中身に、まだ合意していない状態。一度も合意していないものと、前の合意から中身が変わったものの両方を含む"

[[term]]
id = "agreed"
name = "合意済"
definition = "今の中身に合意している状態"

[[term]]
id = "base-branch"
name = "ベースブランチ"
definition = "差分を出す時に比べるブランチ。そのブランチとの分岐点と比べる"

[[term]]
id = "ai-proposal"
name = "AI 案"
definition = "要求にも質疑にもなく、AI が自分で決めたもの"
part_of = "flag"

[[term]]
id = "guess"
name = "推測"
definition = "AI が確かめずに推し量って書いた所があるもの"
part_of = "flag"

[[term]]
id = "changed-since-agreement"
name = "差分あり"
definition = "前の合意から中身が変わったもの"
part_of = "flag"

[[term]]
id = "check"
name = "審査"
definition = "CLI の vanda check が行う点検。約束リスト・アノテーション・Story: のトレーラー・合意・エビデンスの予定などを読んで、間違いや矛盾がなく基準を満たすかを判断する"

[[term]]
id = "promise-list-shape-check"
name = "約束リストの形の審査"
definition = "約束リストが決まった形で書かれているかを確かめる審査。審査の設定に書く名前は promise-list-shape"
part_of = "check"

[[term]]
id = "annotation-links-check"
name = "アノテーションのつながりの審査"
definition = "アノテーションが、約束リストにある用語・機能・約束を正しく指しているかを確かめる審査。審査の設定に書く名前は annotation-links"
part_of = "check"

[[term]]
id = "story-origin-check"
name = "由来の審査"
definition = "約束リストを変えたコミットが、どのストーリーのものか分かるかを確かめる審査。審査の設定に書く名前は story-origin"
part_of = "check"

[[term]]
id = "agreement-check"
name = "合意の審査"
definition = "合意の対象の今の中身に、PO が合意しているかを確かめる審査。審査の設定に書く名前は agreement"
part_of = "check"

[[term]]
id = "agreement-targets-check"
name = "合意の記録の指す先の審査"
definition = "合意の記録が、約束リストにあるものを指しているかを確かめる審査。審査の設定に書く名前は agreement-targets"
part_of = "check"

[[term]]
id = "evidence-present-check"
name = "エビデンスが揃っている審査"
definition = "約束に予定したエビデンスが揃っているかを確かめる審査。審査の設定に書く名前は evidence-present"
part_of = "check"

[[term]]
id = "unread-files-check"
name = "読まれていないファイルの審査"
definition = ".vanda/ に、vanda が読まないファイルが置かれていないかを確かめる審査。審査の設定に書く名前は unread-files"
part_of = "check"

[[term]]
id = "mistake"
name = "誤り"
definition = "人が書いたもの（設定・約束リスト・合意の記録・アノテーション・コマンドの引数など）の間違いで、vanda が見つけて知らせるもの。例: 設定の誤り、約束リストの形の誤り、審査で見つかった誤り"

[[term]]
id = "error"
name = "エラー"
definition = "vanda や、vanda が呼んだもの（アダプタ・git・ストーリーストアなど）が、処理を続けられずに失敗すること。0 以外の終了コードや、API の 4xx・5xx で返す。例: アダプタが 0 以外で終わった、GitHub に繋がらない"

[[term]]
id = "flag"
name = "フラグ"
definition = "注意して読む手がかりとして、約束などに立てるもの"

[[term]]
id = "annotation"
name = "アノテーション"
definition = "仕様・テスト・本番のコードに書く注釈。約束などの ID を指す（例: @vanda:evidence <約束の ID>）"

[[term]]
id = "adapter"
name = "アダプタ"
definition = "vanda と、言語や道具・ストーリーストア・ガードレールの定義とのあいだで受け渡しをする部品"

[[term]]
id = "builtin-adapter"
name = "組込みのアダプタ"
definition = "vanda が中に持つアダプタ"
part_of = "adapter"

[[term]]
id = "custom-adapter"
name = "カスタムアダプタ"
definition = "利用者がアダプタのディレクトリに置いたアダプタ"
part_of = "adapter"

[[term]]
id = "fingerprint"
name = "指紋"
definition = "中身が同じかを比べるための値。合意の記録は、合意した時の指紋を持つ"

[[term]]
id = "story-store"
name = "ストーリーストア"
definition = "ストーリーを書いて置いておく所。例: GitHub Issues。vanda はここからストーリーを読む"

[[term]]
id = "story-trailer"
name = "Story: のトレーラー"
definition = "コミットのメッセージの末尾に書く Story: <ID>（Co-Authored-By: と同じ Git のトレーラー）。そのコミットがどのストーリーのものかを表す"

[[term]]
id = "reference"
name = "参照"
definition = "約束リストの文の中で、ほかの用語・機能・約束を ID で指したもの"

[[term]]
id = "vanda-dir"
name = ".vanda/"
definition = "vanda が読み書きするファイルを置く、リポジトリの直下のディレクトリ（.vanda/）"

[[term]]
id = "config-file"
name = "設定のファイル"
definition = "vanda の設定を書いたファイル（.vanda/config.toml）"
part_of = "vanda-dir"

[[term]]
id = "default-promise-list-file"
name = "約束リストの既定のファイル"
definition = "設定に promises を書かない時に、約束リストとして読むファイル（.vanda/promises.toml）"
part_of = "vanda-dir"

[[term]]
id = "default-agreement-record-file"
name = "合意の記録の既定のファイル"
definition = "設定に agreements を書かない時に、合意の記録として読み書きするファイル（.vanda/agreements.toml）"
part_of = "vanda-dir"

[[term]]
id = "check-config-dir"
name = "審査の設定のディレクトリ"
definition = "審査の設定を <名前>.toml という名前で置くディレクトリ（.vanda/checks/）"
part_of = "vanda-dir"

[[term]]
id = "adapter-dir"
name = "アダプタのディレクトリ"
definition = "カスタムアダプタを置くディレクトリ（.vanda/adapters/）"
part_of = "vanda-dir"

[[term]]
id = "check-config"
name = "審査の設定"
definition = "どの審査を、どの範囲で行うかを書いたファイル"

[[term]]
id = "check-scope"
name = "範囲"
definition = "審査が見るもの"

[[term]]
id = "branch-point"
name = "分岐点"
definition = "今のブランチがベースブランチから分かれたコミット"

[[term]]
id = "detached"
name = "外れた合意"
definition = "ストーリーが合意したことがあり、今の中身にそのストーリーの合意がないもの。誰が変えたかを問わない"

[[term]]
id = "evidence-plan"
name = "エビデンスの予定"
definition = "約束ごとに、どのステージで、どのタイプのエビデンスを、どのレイヤーで得るかを書いたもの（約束リストの項目は evidence）"

[[feature]]
id = "start-server"
name = "vanda サーバーを起動する（vanda serve）"
definition = "vanda サーバーを起動し、画面をブラウザで開く"

[[feature]]
id = "read-promise-list"
name = "約束リストを読む"
definition = "約束リストを読み、形を確かめる"

[[feature]]
id = "show-references"
name = "参照を、指す先が分かる形で見せる"
definition = "約束リストの文の中の参照を、指す先が分かる形で見せる"

[[feature]]
id = "store-agreements"
name = "合意の記録を読み書きする"
definition = "合意の記録を読み書きする"

[[feature]]
id = "build-origins"
name = "由来を作る"
definition = "約束ごとの由来を作る"

[[feature]]
id = "choose-base-branch"
name = "ベースブランチを選ぶ"
definition = "比べるベースブランチを、画面でその場で選ぶ"

[[feature]]
id = "connect-story-store"
name = "ストーリーストアと連携する"
definition = "ストーリーストアから、ストーリーを読む"

[[feature]]
id = "store-config"
name = "設定をファイルに書く"
definition = "設定をファイルに持つ"

[[feature]]
id = "list-changes"
name = "ストーリーで変わったものを並べる"
definition = "比べる元と今のあいだで変わったものの一覧を示す"

[[feature]]
id = "number-changes"
name = "通し番号と総数を示す"
definition = "一覧に通し番号と総数を示す"

[[feature]]
id = "raise-flags"
name = "フラグを立てる"
definition = "注意して読む手がかりとして、フラグを立てる"

[[feature]]
id = "compare-contents"
name = "変更前と変更後の中身を比べる"
definition = "変更・削除したものの、変更前と変更後の中身と差分を示す"

[[feature]]
id = "agree-on-review"
name = "合意する"
definition = "1 件に合意する"
core = true
formal = true

[[feature]]
id = "show-evidence-status"
name = "エビデンスの予定と実際を示す"
definition = "エビデンスの予定ごとに、揃っているかを示す"

[[feature]]
id = "fold-groups"
name = "長い一覧をたたむ"
definition = "一覧をまとまりごとにたたむ"

[[feature]]
id = "switch-review-unit"
name = "レビュー単位を切り替える"
definition = "レビュー単位を切り替える"

[[feature]]
id = "show-detached"
name = "外れた合意を示す"
definition = "外れた合意を示す"

[[feature]]
id = "show-entry-history"
name = "1 件の詳細に由来と合意の履歴を示す"
definition = "レビューの 1 件の詳細に、約束の由来と合意の履歴を示す"

[[feature]]
id = "revoke-agreement"
name = "合意を取り消す"
definition = "合意を取り消す"
core = true
formal = true

[[feature]]
id = "agree-on-detail-pages"
name = "約束の詳細とファイルの画面で合意する"
definition = "約束の詳細の画面と、ファイルの画面でも、合意する・合意を取り消す"

[[feature]]
id = "show-claim-fields"
name = "約束の文・理由・条件・レイヤーを示す"
definition = "約束の詳細に、約束の中身を示す"

[[feature]]
id = "show-claim-evidence"
name = "約束のエビデンスを示す"
definition = "約束の詳細に、エビデンスを示す"

[[feature]]
id = "show-claim-origin"
name = "約束の由来を示す"
definition = "約束の詳細に、由来を示す"

[[feature]]
id = "show-claim-agreements"
name = "約束の合意の履歴を示す"
definition = "約束の詳細に、合意の履歴を示す"

[[feature]]
id = "render-tla-symbols"
name = "TLA+ を数学の記号で見せる"
definition = "オラクルの定義（TLA+）を数学の記号で見せる"

[[feature]]
id = "show-claim-at-commit"
name = "その時点の約束の中身を示す"
definition = "由来のコミットや合意の記録を選ぶと、その時点の約束の中身を示す"

[[feature]]
id = "diagnose-setup"
name = "設定とつながりを確かめる（vanda doctor）"
definition = "今効いている設定と版と、ストーリーストアにつながるかを確かめる"

[[feature]]
id = "run-checks"
name = "審査を行う（vanda check）"
definition = "審査の設定のファイルに並べた審査を行う"

[[feature]]
id = "list-check-kinds"
name = "審査を列挙する"
definition = "vanda check で行える審査の種類を用意する。どの種類があるかは、用語「審査」の一部として並べる"

[[feature]]
id = "create-vanda-dir"
name = ".vanda/ を作る（vanda init）"
definition = "端末で問いかけ、答えで .vanda/ を作る"

[[feature]]
id = "show-version"
name = "版を出す（vanda version）"
definition = "動いている vanda の版を出す"

[[feature]]
id = "read-annotations"
name = "アノテーションを読み取る"
