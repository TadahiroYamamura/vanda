[[truth]]
id = "unchecked-not-released"
statement = "{@id:check}が通らないものは、リリースされない"

[[truth]]
id = "repository-code-not-malicious"
statement = "リポジトリで管理されているプログラムに、悪意のあるコードは混ざっていない"

[[truth]]
id = "user-device-not-compromised"
statement = "利用者の端末で、悪意のあるプログラムは動いておらず、悪意のある人は端末を操作していない"

[[property]]
id = "accountability-by-design"
statement = "オーナーと開発者は、{@id:accountability}を体系的に設計できる。構成要素のそれぞれがどの程度実現されているかを判断でき、改善できる"

[[property]]
id = "agreement-authentic"
statement = "{@id:agreement}は、オーナーが見た中身にだけ結びつき、後から黙って変わらない。オーナーは、誤った{@id:agreement}を、自分で取り消せる"
refines = ["accountability-by-design"]

[[property]]
id = "unagreed-change-blocked"
statement = "{@id:agreement}されていない変更があれば、{@id:vanda} の{@id:check}は通らない"
refines = ["accountability-by-design"]
assumes = ["unchecked-not-released"]

[[property]]
id = "spec-backed-by-valid-evidence"
statement = "{@id:vanda} は、有効な{@id:evidence}に支持されている{@id:spec}だけを、成立しているものとして扱う。{@id:evidence}が有効でなくなれば、その{@id:spec}を成立しているものとして扱わない"
refines = ["accountability-by-design"]
assumes = ["unchecked-not-released"]

[[property]]
id = "change-traceable"
statement = "どの変更も、どの{@id:story}で、誰が何を{@id:agreement}したかまで辿れる"
refines = ["accountability-by-design"]

[[property]]
id = "sufficiency-recorded"
statement = "{@id:vanda} は、{@id:sufficiency}の確認内容とその{@id:agreement}を記録する。下の{@id:item}が変わった時は、その確認が古くなったことを知らせる"
refines = ["accountability-by-design"]

[[property]]
id = "falsification-condition-shown"
statement = "{@id:vanda} は、{@id:spec}と{@id:evidence}の反証の条件を、{@id:evidence}を確認する人に見せる。反証の条件のない{@id:evidence}を見分けられるようにする"
refines = ["accountability-by-design"]

[[property]]
id = "actor-recorded"
statement = "{@id:vanda} は、実装・{@id:evidence}・確認・{@id:agreement}のそれぞれを、どの行為者が行ったかを記録に残す。オーナーと開発者は、その記録から、別の行為者が行ったかを確かめられる"
refines = ["accountability-by-design"]

[[property]]
id = "accountability-level-shown"
statement = "{@id:vanda} は、{@id:deviation-kind}ごとに、次の 4 つのそれぞれに{@id:countermeasure}があるかを記録する。早く検知される、被害が致命的にならない、原因まで辿れる、同じ{@id:deviation}を次は事前に検知できるよう{@id:promise-list}に反映できる。4 つのすべてに{@id:countermeasure}がある{@id:deviation-kind}の割合を、{@id:accountability}の実現度として、その内訳とともに見せる"
refines = ["accountability-by-design"]

[[property]]
id = "controlled-deviation"
statement = "{@id:deviation}を抜けなく想定し、早く検知し、致命的な状況を避けられる"

[[property]]
id = "deviation-anticipated"
statement = "{@id:vanda} は、起こりうる{@id:deviation}を抜けなく想定するための手がかりを、{@id:spec}を書く人と{@id:sufficiency}を確認する人に渡す"
refines = ["controlled-deviation"]

[[property]]
id = "deviation-detected-early"
statement = "事前に想定した{@id:deviation}は、どの{@id:property}からどう外れたかが分かる形で、早く見つかる"
refines = ["controlled-deviation"]

[[property]]
id = "feedback-through-developer"
statement = "オーナーは開発者（人）に、開発者（人）は開発者（AI）に、見つけた{@id:deviation}と、{@id:agreement}しない理由をフィードバックできる。開発者（AI）は開発者（人）に、開発者（人）はオーナーに、{@id:promise-list}の不備をフィードバックできる。{@id:vanda} は、どちらの向きでも、開発者（人）を飛ばして届けない"
refines = ["controlled-deviation"]

[[property]]
id = "fatal-situation-avoided"
statement = "リリースの前に見つけられない{@id:deviation}に備えて、{@id:vanda} は、リリースの後の{@id:stage}の{@id:evidence}も求め、満たされなくなった時に知らせる"
refines = ["controlled-deviation"]

[[property]]
id = "user-pc-and-secrets-safe"
statement = "{@id:vanda} は、利用者の PC と秘密の情報を危険にさらさない"
assumes = ["repository-code-not-malicious", "user-device-not-compromised"]

[[property]]
id = "risk-judged-attention-spent-well"
statement = "オーナーと開発者（人）は、リスクを判断でき、注意力を合理的に投下できる"

[[property]]
id = "judge-without-reading-code"
statement = "オーナーは、ソースコードを読まずに、開発者の変更が{@id:deviation}を持ち込んでいないことを判断できる"
refines = ["risk-judged-attention-spent-well"]

[[property]]
id = "severe-loss-visible"
statement = "{@id:vanda} は、深刻な損失（データが壊れる、個人情報が流出する、業務が止まる、など）が起こりうる所を、オーナーが見分けられるようにし、そこに強い{@id:evidence}を求める。オーナーが読む量を、判断に要る分だけに保つ"
refines = ["risk-judged-attention-spent-well"]

[[property]]
id = "developer-confirmation-recorded"
statement = "{@id:vanda} は、開発者（人）が確認した内容を記録し、オーナーに見せる。オーナーは、開発者（人）の確認の上に立って、全体を判断する"
refines = ["risk-judged-attention-spent-well"]

[[property]]
id = "ai-output-flagged"
statement = "{@id:vanda} は、開発者（AI）が提案した所と推測した所を、開発者（人）が見分けられるようにする"
refines = ["risk-judged-attention-spent-well"]

[[property]]
id = "easy-to-use"
statement = "利用者は、手間をかけずに {@id:vanda} を使える"

[[property]]
id = "adopt-in-new-project"
statement = "新しいプロジェクトに、{@id:vanda} を導入できる"
refines = ["easy-to-use"]

[[property]]
id = "adopt-in-existing-project"
statement = "既にあるプロジェクトに、{@id:vanda} を導入できる"
refines = ["easy-to-use"]

[[term]]
id = "evidence-first-development"
name = "エビデンス・ファースト開発"
definition = "AI がソースコードを書き、人はソースコードを読まずに、{@id:spec}と{@id:evidence}で開発を進めるやり方"

[[term]]
id = "vanda"
name = "vanda"
definition = "{@id:evidence-first-development}を支える道具。{@id:promise-list}を持ち、変わったものにレビューで{@id:agreement}し、{@id:spec}が{@id:evidence}で裏付けられているかを{@id:check}する"

[[term]]
id = "software"
name = "ソフトウェア"
definition = "{@id:vanda} で開発するもの。{@id:vanda-dir} を置いた git のリポジトリで作っているもの"

[[term]]
id = "vanda-server"
name = "vanda サーバー"
definition = "vanda serve が起動する Web サーバー。画面と、画面が使う API を出す"

[[term]]
id = "promise-list"
name = "約束リスト"
definition = "{@id:software}について正とする一覧。{@id:item}（{@id:property}・{@id:feature}・{@id:spec}・{@id:term}・{@id:truth}）を書く"

[[term]]
id = "spec"
name = "仕様"
definition = "{@id:feature}が満たすべき条件（事前条件・事後条件・不変条件・制約・受け入れ条件）。{@id:promise-list}での書き方は [[spec]]"

[[term]]
id = "item"
name = "項目"
definition = "{@id:promise-list}に書くもの。{@id:property}・{@id:feature}・{@id:spec}・{@id:term}・{@id:truth}"

[[term]]
id = "property"
name = "性質"
definition = "{@id:software}が満たすべき性質。提供すべき価値と、セキュリティなどの守るべき決まり。{@id:promise-list}での書き方は [[property]]"

[[term]]
id = "truth"
name = "前提"
definition = "{@id:term}・{@id:property}・{@id:spec}の前提となる事実。検証されない。{@id:promise-list}での書き方は [[truth]]"

[[term]]
id = "tier"
name = "層"
definition = "{@id:property}・{@id:feature}・{@id:spec}・{@id:evidence}の、抽象から具体へ並ぶ 4 つの段"

[[term]]
id = "refine"
name = "具体化"
definition = "下の{@id:tier}の{@id:item}が、上の{@id:tier}の{@id:item}を、より具体的に定めること。{@id:promise-list}での項目名は refines。動作は「具体化する」"

[[term]]
id = "sufficiency"
name = "十分性"
definition = "上の{@id:tier}の{@id:item}が、下の{@id:tier}の{@id:item}により、抜け漏れなく具体化されていること"

[[term]]
id = "deviation"
name = "逸脱"
definition = "{@id:software}が、満たすべき{@id:property}を満たさなくなること。{@id:mistake}と{@id:error}は、開発者が受け取って直すもので、逸脱とは区別する"

[[term]]
id = "deviation-kind"
name = "逸脱の種類"
definition = "{@id:deviation}を、どの{@id:property}から、どのように外れるかで分けたもの。1 つの{@id:property}に、複数ある"

[[term]]
id = "countermeasure"
name = "対策"
definition = "{@id:deviation}が起きた時に、早く検知し、被害を致命的にせず、原因まで辿り、同じ{@id:deviation}を次は事前に検知できるよう{@id:promise-list}に反映するために、事前に用意しておく手段"

[[term]]
id = "accountability"
name = "答責性"
definition = "{@id:software}が{@id:deviation}によって損失を出した時に、オーナーと開発者が、何が起き、事前にどんな{@id:countermeasure}を取っていて、どう最悪の事態を避けて収束させたかを説明し、責任を取れること"

[[term]]
id = "core-feature"
name = "コア機能"
definition = "失敗すると著しい損害があるので、十分に確かめると決めた{@id:feature}。{@id:promise-list}での項目名は core"

[[term]]
id = "formal-feature"
name = "形式手法を使う機能"
definition = "{@id:oracle}（TLA+）で確かめる{@id:feature}。{@id:promise-list}での項目名は formal。{@id:core-feature}は、理由を書いて{@id:agreement}しない限り形式手法を使う。形式手法を使う{@id:feature}の{@id:spec}は、どれも TLA+ で確かめるか、確かめない理由を書く"

[[term]]
id = "term"
name = "用語"
definition = "ものや概念の意味（例: {@id:agreement-record}、{@id:fingerprint}）。{@id:promise-list}での書き方は [[term]]"

[[term]]
id = "feature"
name = "機能"
definition = "{@id:property}を実現するために実装するもの。{@id:promise-list}での書き方は [[feature]]"

[[term]]
id = "layer"
name = "レイヤー"
definition = "{@id:spec}が{@id:software}のどの部分の話か"

[[term]]
id = "origin"
name = "変更履歴"
definition = "{@id:spec}が作られたり変わったりした履歴（コミット）"

[[term]]
id = "evidence"
name = "エビデンス"
definition = "{@id:spec}が成り立っていることの裏付け"

[[term]]
id = "stage"
name = "ステージ"
definition = "{@id:evidence}を得る開発の段階。{@id:promise-list}での項目名は stage"
part_of = "evidence"

[[term]]
id = "plan-stage"
name = "計画"
definition = "ソースコードや設定ファイルを編集しなくても得られ、リリースの前に確かめられる{@id:evidence}に{@id:agreement}する段階。例: {@id:spec}、モデル、コードベースを分析した結果（カバレッジ、ホットスポットなど）"
part_of = "stage"

[[term]]
id = "implementation-stage"
name = "実装"
definition = "ソースコードや設定ファイルを足したり、変えたり、消したりして得られ、リリースの前に確かめられる{@id:evidence}に{@id:agreement}する段階。例: 社内に 3 つの案を公開して試した結果"
part_of = "stage"

[[term]]
id = "release-stage"
name = "リリース"
definition = "{@id:software}をリリースする時に確かめられる{@id:evidence}に{@id:agreement}する段階"
part_of = "stage"

[[term]]
id = "operation-stage"
name = "運用"
definition = "リリースした後に、動いている{@id:software}から確かめられる{@id:evidence}に{@id:agreement}する段階。例: {@id:sensor}で確かめた結果"
part_of = "stage"

[[term]]
id = "evidence-type"
name = "タイプ"
definition = "{@id:evidence}の種類。{@id:promise-list}での項目名は type"
part_of = "evidence"

[[term]]
id = "oracle"
name = "オラクル"
definition = "{@id:cross-check}や{@id:random-check}の正解を出すもの。TLA+ のモデルや、{@id:proof}した関数など。{@id:evidence}の{@id:evidence-type}ではない"

[[term]]
id = "model-check"
name = "モデル検査"
definition = "決めた範囲の中のすべての状態をたどって、性質が成り立つことを確かめる（TLC）"
part_of = "evidence-type"

[[term]]
id = "proof"
name = "証明"
definition = "すべての値で性質が成り立つことを示す（Dafny等）"
part_of = "evidence-type"

[[term]]
id = "cross-check"
name = "クロスチェック"
definition = "{@id:oracle}と実装に同じ操作を送り、結果を比べるテスト（モデルベーステスト）"
part_of = "evidence-type"

[[term]]
id = "random-check"
name = "ランダムチェック"
definition = "無作為な入力で性質を確かめるテスト（プロパティベーステスト）"
part_of = "evidence-type"

[[term]]
id = "unit-test"
name = "単体テスト"
definition = "部品を 1 つずつ、決めた入力で動かして確かめるテスト"
part_of = "evidence-type"

[[term]]
id = "interface-test"
name = "インターフェースのテスト"
definition = "DB や CLI などの境界の振る舞いを確かめるテスト"
part_of = "evidence-type"

[[term]]
id = "concurrency-test"
name = "同時実行のテスト"
definition = "複数の操作を同時に行っても、{@id:spec}が成り立つことを確かめるテスト"
part_of = "evidence-type"

[[term]]
id = "human-review"
name = "人のレビュー"
definition = "人が読んで確かめること"
part_of = "evidence-type"

[[term]]
id = "guardrail-evidence"
name = "ガードレールの検証"
definition = "{@id:guardrail}が設定されていて、{@id:spec}に反するものを本当に拒むことの裏付け。{@id:guardrail-definition}と、拒むことを確かめた結果（例: ミューテーションテストの結果）からなる"
part_of = "evidence-type"

[[term]]
id = "sensor-evidence"
name = "センサーの検証"
definition = "{@id:sensor}が実装のコードの中にあり、{@id:spec}が満たされない時に本当に見つけて知らせることの裏付け。{@id:sensor-location}と、見つけることを確かめた結果（例: ミューテーションテストの結果）からなる"
part_of = "evidence-type"

[[term]]
id = "scenario"
name = "シナリオ"
definition = "利用者の操作の流れで{@id:spec}を確かめる台本（{@id:evidence}の本体）"

[[term]]
id = "scenario-test"
name = "シナリオテスト"
definition = "{@id:scenario}を動かして確かめるテスト。CLI の txtar、端末で質問するものの Expect、画面の E2E のどれで書いた{@id:scenario}も含む"
part_of = "evidence-type"

[[term]]
id = "guardrail"
name = "ガードレール"
definition = "実装のコードとは別の所で、{@id:spec}に反するものを拒む仕組み。コードを読まない人が確かめられるもの。例: DB の制約・トリガー、ファイルの権限、外との境界のスキーマの検証、サンドボックスや通信の許可の一覧。見つけるだけのもの（{@id:sensor}、テスト）は含めない"

[[term]]
id = "guardrail-definition"
name = "ガードレールの定義"
definition = "{@id:guardrail}を設定として書いたファイル。例: IaC の設定ファイル、DB のスキーマ"

[[term]]
id = "sensor"
name = "センサー"
definition = "実装のコードの中で、操作の後に{@id:spec}が成り立っているかを確かめ、満たされていなければ見つけて知らせる仕組み（事後条件の確認）。拒むのではなく見つける。例: 操作の後の状態を確かめ、破れていればエラーを返して記録する。実装のコードの外で拒むものは{@id:guardrail}、開発中に確かめるものはテスト"

[[term]]
id = "sensor-location"
name = "センサーの場所"
definition = "{@id:sensor}がある、実装のコードの中の場所。sensor の{@id:annotation}で示す"

[[term]]
id = "story"
name = "ストーリー"
definition = "開発の単位。{@id:story-store}（GitHub Issues など）で管理する"

[[term]]
id = "agreement"
name = "承認"
definition = "{@id:spec}などの今の中身が要求どおりかを人が確かめ、認めること。動作は「承認する」"

[[term]]
id = "agreement-record"
name = "承認の記録"
definition = "{@id:agreement}を書き留めたもの。{@id:spec}・{@id:term}・{@id:feature}なら ID と中身の{@id:fingerprint}の組、ファイルならファイルパスと中身の{@id:fingerprint}の組ごとに、誰が・いつ・どの{@id:story}で{@id:agreement}したかを書く。{@id:promise-list}とは別のファイルに置く"

[[term]]
id = "proposed"
name = "提案中"
definition = "今の中身に、まだ{@id:agreement}していない状態。一度も{@id:agreement}していないものと、前の{@id:agreement}から中身が変わったものの両方を含む"

[[term]]
id = "agreed"
name = "承認済"
definition = "今の中身に{@id:agreement}している状態"

[[term]]
id = "base-branch"
name = "ベースブランチ"
definition = "差分を出す時に比べるブランチ。そのブランチとの{@id:branch-point}と比べる"

[[term]]
id = "ai-proposal"
name = "AI 案"
definition = "要求にも質疑にもなく、AI が自分で決めたもの"
part_of = "flag"

[[term]]
id = "guess"
name = "推測"
definition = "AI が確かめずに推し量って書いた所があるもの"
part_of = "flag"

[[term]]
id = "changed-since-agreement"
name = "差分あり"
definition = "前の{@id:agreement}から中身が変わったもの"
part_of = "flag"

[[term]]
id = "check"
name = "チェック"
definition = "CLI の vanda check が、{@id:promise-list}・{@id:annotation}・{@id:story-trailer}・{@id:agreement}・{@id:evidence-plan}などを読んで、間違いや矛盾がなく基準を満たすかを判断すること"

[[term]]
id = "promise-list-shape-check"
name = "約束リストの形のチェック"
definition = "{@id:promise-list}が決まった形で書かれているかを確かめる{@id:check}。{@id:check-config}に書く名前は promise-list-shape"
part_of = "check"

[[term]]
id = "annotation-links-check"
name = "アノテーションのつながりのチェック"
definition = "{@id:annotation}が、{@id:promise-list}にある{@id:term}・{@id:feature}・{@id:spec}を正しく指しているかを確かめる{@id:check}。{@id:check-config}に書く名前は annotation-links"
part_of = "check"

[[term]]
id = "story-origin-check"
name = "コミットのストーリーのチェック"
definition = "{@id:promise-list}を変えたコミットが、どの{@id:story}のものか分かるかを確かめる{@id:check}。{@id:check-config}に書く名前は story-origin"
part_of = "check"

[[term]]
id = "agreement-check"
name = "承認のチェック"
definition = "{@id:agreement}の対象の今の中身に、オーナー が{@id:agreement}しているかを確かめる{@id:check}。{@id:check-config}に書く名前は agreement"
part_of = "check"

[[term]]
id = "agreement-targets-check"
name = "承認の記録の指す先のチェック"
definition = "{@id:agreement-record}が、{@id:promise-list}にあるものを指しているかを確かめる{@id:check}。{@id:check-config}に書く名前は agreement-targets"
part_of = "check"

[[term]]
id = "evidence-present-check"
name = "エビデンス完備のチェック"
definition = "{@id:spec}に予定した{@id:evidence}が揃っているかを確かめる{@id:check}。{@id:check-config}に書く名前は evidence-present"
part_of = "check"

[[term]]
id = "unread-files-check"
name = "読まれていないファイルのチェック"
definition = "{@id:vanda-dir} に、{@id:vanda} が読まないファイルが置かれていないかを確かめる{@id:check}。{@id:check-config}に書く名前は unread-files"
part_of = "check"

[[term]]
id = "mistake"
name = "誤り"
definition = "人が書いたもの（設定・{@id:promise-list}・{@id:agreement-record}・{@id:annotation}・コマンドの引数など）の間違いで、{@id:vanda} が見つけて知らせるもの。例: 設定の誤り、{@id:promise-list}の形の誤り、{@id:check}で見つかった誤り"

[[term]]
id = "error"
name = "エラー"
definition = "{@id:vanda} や、{@id:vanda} が呼んだもの（{@id:adapter}・git・{@id:story-store}など）が、処理を続けられずに失敗すること。0 以外の終了コードや、API の 4xx・5xx で返す。例: {@id:adapter}が 0 以外で終わった、GitHub に繋がらない"

[[term]]
id = "flag"
name = "フラグ"
definition = "注意して読む手がかりとして、{@id:spec}などに立てるもの"

[[term]]
id = "annotation"
name = "アノテーション"
definition = "仕様・テスト・本番のコードに書く注釈。{@id:spec}などの ID を指す（例: @vanda:evidence <{@id:spec}の ID>）"

[[term]]
id = "adapter"
name = "アダプタ"
definition = "{@id:vanda} と、言語や道具・{@id:story-store}・{@id:guardrail-definition}とのあいだで受け渡しをする部品"

[[term]]
id = "builtin-adapter"
name = "組み込みのアダプタ"
definition = "{@id:vanda} が中に持つ{@id:adapter}"
part_of = "adapter"

[[term]]
id = "custom-adapter"
name = "カスタムアダプタ"
definition = "利用者が{@id:adapter-dir}に置いた{@id:adapter}"
part_of = "adapter"

[[term]]
id = "fingerprint"
name = "フィンガープリント"
definition = "中身が同じかを比べるための値。{@id:agreement-record}は、{@id:agreement}した時のフィンガープリントを持つ"

[[term]]
id = "story-store"
name = "ストーリーストア"
definition = "{@id:story}を書いて置いておく所。例: GitHub Issues。{@id:vanda} はここから{@id:story}を読む"

[[term]]
id = "story-trailer"
name = "Story: のトレーラー"
definition = "コミットのメッセージの末尾に書く Story: <ID>（Co-Authored-By: と同じ Git のトレーラー）。そのコミットがどの{@id:story}のものかを表す"

[[term]]
id = "reference"
name = "参照"
definition = "{@id:promise-list}の文の中で、ほかの{@id:term}・{@id:feature}・{@id:spec}を ID で指したもの"

[[term]]
id = "vanda-dir"
name = ".vanda/"
definition = "{@id:vanda} が読み書きするファイルを置く、リポジトリの直下のディレクトリ（.vanda/）"

[[term]]
id = "config-file"
name = "設定のファイル"
definition = "{@id:vanda} の設定を書いたファイル（.vanda/config.toml）"
part_of = "vanda-dir"

[[term]]
id = "default-promise-list-file"
name = "約束リストの既定のファイル"
definition = "設定に promises を書かない時に、{@id:promise-list}として読むファイル（.vanda/promises.toml）"
part_of = "vanda-dir"

[[term]]
id = "default-agreement-record-file"
name = "承認の記録の既定のファイル"
definition = "設定に agreements を書かない時に、{@id:agreement-record}として読み書きするファイル（.vanda/agreements.toml）"
part_of = "vanda-dir"

[[term]]
id = "check-config-dir"
name = "チェックの設定のディレクトリ"
definition = "{@id:check-config}を <名前>.toml という名前で置くディレクトリ（.vanda/checks/）"
part_of = "vanda-dir"

[[term]]
id = "adapter-dir"
name = "アダプタのディレクトリ"
definition = "{@id:custom-adapter}を置くディレクトリ（.vanda/adapters/）"
part_of = "vanda-dir"

[[term]]
id = "check-config"
name = "チェックの設定"
definition = "vanda check で行う{@id:check}の種類と{@id:check-scope}を定義するファイル"

[[term]]
id = "check-scope"
name = "スコープ"
definition = "{@id:check}で確認する範囲"

[[term]]
id = "branch-point"
name = "マージベース"
definition = "今のブランチが{@id:base-branch}から分かれたコミット"

[[term]]
id = "detached"
name = "失効した承認"
definition = "{@id:story}が{@id:agreement}したことがあり、今の中身にその{@id:story}の{@id:agreement}がないもの。誰が変えたかを問わない"

[[term]]
id = "evidence-plan"
name = "エビデンスの予定"
definition = "{@id:spec}ごとに、どの{@id:stage}で、どの{@id:evidence-type}の{@id:evidence}を、どの{@id:layer}で得るかを書いたもの（{@id:promise-list}の項目は evidence）"

[[feature]]
id = "agree-on-seen-content"
name = "画面で見た中身を承認する"
definition = "オーナーが画面で見た中身の{@id:fingerprint}に、{@id:agreement}を結びつける"
refines = ["agreement-authentic"]
core = true

[[feature]]
id = "detach-changed-agreement"
name = "中身が変わった承認を失効させる"
definition = "{@id:agreement}の後に中身が変わった{@id:item}を、{@id:agreed}として扱わない"
refines = ["agreement-authentic"]

[[feature]]
id = "revoke-agreement"
name = "承認を取り消す"
definition = "オーナーが、自分の行った{@id:agreement}を取り消す"
refines = ["agreement-authentic"]
core = true

[[feature]]
id = "block-unagreed-changes"
name = "承認されていない変更を止める"
definition = "{@id:agreement}されていない変更を、{@id:agreement-check}で{@id:mistake}にする"
refines = ["unagreed-change-blocked"]

[[feature]]
id = "link-evidence-by-annotation"
name = "アノテーションで仕様とエビデンスを結びつける"
definition = "テスト・モデル・{@id:sensor}などに書いた{@id:annotation}から、どの{@id:spec}を支持するかを読み取る"
refines = ["spec-backed-by-valid-evidence"]

[[feature]]
id = "block-specs-without-evidence"
name = "エビデンスのない仕様を止める"
definition = "{@id:evidence-plan}のとおりの{@id:evidence}がない{@id:spec}を、{@id:evidence-present-check}で{@id:mistake}にする"
refines = ["spec-backed-by-valid-evidence"]

[[feature]]
id = "link-changes-to-story"
name = "変更をストーリーに結びつける"
definition = "コミットの {@id:story-trailer}から、変更がどの{@id:story}のものかを読み取り、分からない変更を{@id:story-origin-check}で{@id:mistake}にする"
refines = ["change-traceable"]

[[feature]]
id = "show-item-history"
name = "項目の変更と承認の履歴を示す"
definition = "{@id:item}ごとに、{@id:origin}と{@id:agreement}の履歴を示す"
refines = ["change-traceable"]

[[feature]]
id = "report-mistakes"
name = "チェックの誤りを知らせる"
definition = "{@id:check}で見つけた{@id:mistake}を、どこの何がどう外れたかを添えて知らせる"
refines = ["deviation-detected-early"]

[[feature]]
id = "serve-local-only"
name = "この PC からだけ使えるサーバーを起動する"
definition = "{@id:vanda-server}を、利用者の PC の中からだけ使える形で起動する"
refines = ["user-pc-and-secrets-safe"]

[[feature]]
id = "keep-secrets-unwritten"
name = "秘密の情報を書き残さない"
definition = "{@id:story-store}のトークンなどの秘密の情報を、使う相手にだけ送り、ファイルと出力に書かない"
refines = ["user-pc-and-secrets-safe"]

[[feature]]
id = "list-story-changes"
name = "ストーリーで変わったものを並べる"
definition = "{@id:story}で変わった{@id:item}と{@id:agreement}の対象のファイルを、一覧にする"
refines = ["judge-without-reading-code"]

[[feature]]
id = "compare-contents"
name = "変更前と変更後の中身を比べる"
definition = "変わったものの 1 件ごとに、変更前と変更後の中身を並べ、違いを示す"
refines = ["judge-without-reading-code"]

[[feature]]
id = "show-item-detail"
name = "項目の中身を 1 か所で示す"
definition = "{@id:item}の中身と、{@id:evidence-plan}と実際の{@id:evidence}を、1 つのページに示す"
refines = ["judge-without-reading-code"]

[[feature]]
id = "show-story"
name = "レビューの画面でストーリーを見せる"
definition = "{@id:story-store}から{@id:story}を読み、レビューの画面に出す"
refines = ["judge-without-reading-code"]

[[feature]]
id = "require-formal-evidence-for-core"
name = "コア機能に強いエビデンスを求める"
definition = "{@id:core-feature}に印を付け、その{@id:spec}に、{@id:model-check}の{@id:evidence-plan}か、行わない理由のどちらかを求める"
refines = ["severe-loss-visible"]

[[feature]]
id = "raise-flags"
name = "フラグを立てる"
definition = "開発者（AI）が提案した{@id:spec}と、推測した所に、{@id:flag}を立てる"
refines = ["ai-output-flagged"]

[[feature]]
id = "create-vanda-dir"
name = ".vanda/ を作る（vanda init）"
definition = "端末の質問への答えから、{@id:vanda-dir} を作る"
refines = ["adopt-in-new-project"]

