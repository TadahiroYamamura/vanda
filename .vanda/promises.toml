layers = ["cli"]

[[claim]]
id = "promise-list-id-shape"
subjects = ["cm-02", "cmd-10", "promise-list"]
statement = "用語・機能・約束の ID が、英小文字で始め、英小文字・数字をハイフンでつないだ形でなければ、promise-list-shape の誤りにする"
layers = ["cli"]
flags = ["ai-proposal"]

[[claim.evidence]]
stage = "test"
type = "unit-test"
layers = ["cli"]

[[claim]]
id = "promise-list-id-unique"
subjects = ["cm-02", "cmd-10", "promise-list"]
statement = "用語・機能・約束の ID が、表の種類やファイルを問わず重なれば、後に出てきたほうの行を指し、前に出てきた場所を書いた誤りにする"
layers = ["cli"]
flags = ["ai-proposal"]

[[claim.evidence]]
stage = "test"
type = "unit-test"
layers = ["cli"]

[[claim.evidence]]
stage = "test"
type = "random-check"
layers = ["cli"]

[[claim]]
id = "promise-list-part-of"
subjects = ["cm-02", "cmd-10", "term"]
statement = "用語の part_of の先が用語になければ、または part_of が循環すれば、promise-list-shape の誤りにする"
layers = ["cli"]
flags = ["ai-proposal"]

[[claim.evidence]]
stage = "test"
type = "unit-test"
layers = ["cli"]

[[claim]]
id = "promise-list-subjects-exist"
subjects = ["cm-02", "cmd-10", "promise"]
statement = "約束の subjects の先が用語か機能になければ、promise-list-shape の誤りにする"
layers = ["cli"]
flags = ["ai-proposal"]

[[claim.evidence]]
stage = "test"
type = "unit-test"
layers = ["cli"]

[[claim]]
id = "promise-list-layers-known"
subjects = ["cm-02", "cmd-10", "layer"]
statement = "約束とエビデンスの layers に、設定のレイヤーにない値があれば、promise-list-shape の誤りにする"
layers = ["cli"]
flags = ["ai-proposal"]

[[claim.evidence]]
stage = "test"
type = "unit-test"
