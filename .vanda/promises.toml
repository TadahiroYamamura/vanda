[[term]]
id = "evidence-first-development"
name = "エビデンス・ファースト開発"
definition = "AI がソースコードを書き、人はソースコードを読まずに、約束とエビデンスで開発を進めるやり方"

[[term]]
id = "software"
name = "ソフトウェア"
definition = "vanda で開発するもの。.vanda/ を置いた git のリポジトリで作っているもの"

[[term]]
id = "vanda-server"
name = "vanda サーバー"
definition = "vanda serve が起動する Web サーバー。画面と、画面が使う API を出す"

[[term]]
id = "promise-list"
name = "約束リスト"
definition = "ソフトウェアについて、使う言葉（用語）、利用者が行う操作（機能）、そこで成り立たせると決めたこと（約束）をまとめた一覧（既定は .vanda/promises.toml）。ソフトウェアの正とする"

[[term]]
id = "promise"
name = "約束"
definition = "ソフトウェアが成り立たせると決めたこと"

[[term]]
id = "core-feature"
name = "コア機能"
definition = "失敗すると著しい損害があるので、十分に確かめると決めた機能。約束リストでの項目名は core"

[[term]]
id = "formal-feature"
name = "形式手法を使う機能"
definition = "オラクル（TLA+）で確かめる機能。約束リストでの項目名は formal。コア機能は、理由を書いて合意しない限り形式手法を使う。形式手法を使う機能の約束は、どれも TLA+ で確かめるか、確かめない理由を書く"

[[term]]
id = "term"
name = "用語"
definition = "ものや概念（例: 合意の記録、指紋）。約束の対象の 1 つ"

[[term]]
id = "feature"
name = "機能"
definition = "利用者が行う操作（例: 審査の実行）。約束の対象の 1 つ"

[[term]]
id = "layer"
name = "レイヤー"
definition = "約束がソフトウェアのどの部分の話か。設定で決める（vanda では、モデル・CLI・API・画面）"

[[term]]
id = "origin"
name = "由来"
definition = "約束が作られたり変わったりした履歴（コミット）。約束の中身（flags と guesses を除いた項目）を変えた、合流でないコミットごとに、由来を、そのコミットの Story: のトレーラーが指すストーリーと結ぶ"

[[term]]
id = "evidence"
name = "エビデンス"
definition = "約束が成り立っていることの裏付け"

[[term]]
id = "stage"
name = "ステージ"
definition = "エビデンスを得る開発の段階。計画・実装・テスト・リリース・運用。約束リストでの項目名は stage"
part_of = "evidence"

[[term]]
id = "evidence-type"
name = "タイプ"
definition = "エビデンスの種類（単体テスト、モデル検査、シナリオテストなど）。約束リストでの項目名は type"
part_of = "evidence"

[[term]]
id = "oracle"
name = "オラクル"
definition = "クロスチェックやランダムチェックの正解を出すもの。TLA+ のモデルや、証明した関数など。エビデンスのタイプではない"

[[term]]
id = "model-check"
name = "モデル検査"
definition = "エビデンスのタイプ（model-check）。決めた範囲の中のすべての状態をたどって、性質が成り立つことを確かめる（TLC）"

[[term]]
id = "proof"
name = "証明"
definition = "エビデンスのタイプ（proof）。すべての値で性質が成り立つことを示す（Dafny）"

[[term]]
id = "cross-check"
name = "クロスチェック"
definition = "オラクルと実装に同じ操作を送り、結果を比べるテスト（モデルベーステスト）。タイプの値は cross-check"

[[term]]
id = "random-check"
name = "ランダムチェック"
definition = "無作為な入力で性質を確かめるテスト（プロパティベーステスト）"

[[term]]
id = "scenario"
name = "シナリオ"
definition = "利用者の操作の流れで約束を確かめる台本（エビデンスの本体）。CLI は txtar、端末で問いかけるものは Expect、画面は E2E で書く"

[[term]]
id = "scenario-test"
name = "シナリオテスト"
definition = "シナリオを動かして確かめるエビデンスのタイプ（scenario-test）。CLI の txtar、端末で問いかけるものの Expect、画面の E2E のどれで書いたシナリオも含む"

[[term]]
id = "guardrail"
name = "ガードレール"
definition = "実装のコードとは別の所で、約束に反するものを拒む仕組み。コードを読まない人が確かめられるもの。例: DB の制約・トリガー、ファイルの権限、外との境界のスキーマの検証、サンドボックスや通信の許可の一覧。見つけるだけのもの（センサー、テスト）は含めない"

[[term]]
id = "sensor"
name = "センサー"
definition = "実装のコードの中で、操作の後に約束が成り立っているかを確かめ、破れていたら見つけて知らせる仕組み（事後条件の確認）。拒むのではなく見つける。例: 操作の後の状態を確かめ、破れていればエラーを返して記録する。実装のコードの外で拒むものはガードレール、開発中に確かめるものはテスト"

[[term]]
id = "story"
name = "ストーリー"
definition = "開発の単位。ストーリーの置き場所（GitHub Issues など）で管理し、コミットとは Story: のトレーラーで結ぶ"

[[term]]
id = "agreement"
name = "合意"
definition = "約束などの今の中身が要求どおりかを人が確かめ、認めること。動作は「合意する」"

[[term]]
id = "agreement-record"
name = "合意の記録"
definition = "合意を書き留めたもの。約束・用語・機能なら ID と中身の指紋の組、ファイルならファイルパスと中身の指紋の組ごとに、誰が（合意した時の git の user.name と user.email）・いつ・どのストーリーで合意したかを書く。約束リストとは別のファイルに置く"

[[term]]
id = "proposed"
name = "提案中"
definition = "今の中身に、まだ合意していない状態。一度も合意していないものと、前の合意から中身が変わったものの両方を含む"

[[term]]
id = "agreed"
name = "合意済"
definition = "今の中身に合意している状態"

[[term]]
id = "base-branch"
name = "ベースブランチ"
definition = "差分を出す時に比べるブランチ。そのブランチとの分岐点と比べる。審査では --base で渡し、画面ではその場で選ぶ"

[[term]]
id = "ai-proposal"
name = "AI 案"
definition = "フラグ（注意して読む手がかり）。要求にも質疑にもなく、AI が自分で決めたもの"

[[term]]
id = "guess"
name = "推測"
definition = "フラグ（注意して読む手がかり）。AI が確かめずに書いた事実を含むもの"

[[term]]
id = "changed-since-agreement"
name = "差分あり"
definition = "フラグ（注意して読む手がかり）。前の合意から中身が変わったもの"

[[term]]
id = "check"
name = "審査"
definition = "CLI の vanda check が行う点検。約束リスト・アノテーション・Story: のトレーラー・合意・エビデンスの予定などを読んで、間違いや矛盾がなく基準を満たすかを判断する。オラクルそのもの（モデル検査など）は動かさない"

[[term]]
id = "promise-list-shape-check"
name = "約束リストの形の審査（promise-list-shape）"
definition = "約束リストが決まった形で書かれているかを確かめる審査"
part_of = "check"

[[term]]
id = "annotation-links-check"
name = "アノテーションのつながりの審査（annotation-links）"
definition = "アノテーションが、約束リストにある用語・機能・約束を正しく指しているかを確かめる審査"
part_of = "check"

[[term]]
id = "story-origin-check"
name = "由来の審査（story-origin）"
definition = "約束リストを変えたコミットが、どのストーリーのものか分かるかを確かめる審査"
part_of = "check"

[[term]]
id = "agreement-check"
name = "合意の審査（agreement）"
definition = "合意の対象の今の中身に、PO が合意しているかを確かめる審査"
part_of = "check"

[[term]]
id = "agreement-targets-check"
name = "合意の記録の指す先の審査（agreement-targets）"
definition = "合意の記録が、約束リストにあるものを指しているかを確かめる審査"
part_of = "check"

[[term]]
id = "evidence-present-check"
name = "エビデンスが揃っている審査（evidence-present）"
definition = "約束に予定したエビデンスが揃っているかを確かめる審査"
part_of = "check"

[[term]]
id = "unread-files-check"
name = "読まれていないファイルの審査（unread-files）"
definition = ".vanda/ に、vanda が読まないファイルが置かれていないかを確かめる審査"
part_of = "check"

[[term]]
id = "mistake"
name = "誤り"
definition = "人が書いたもの（設定・約束リスト・合意の記録・アノテーション・コマンドの引数など）の間違いで、vanda が見つけて知らせるもの。例: 設定の誤り、約束リストの形の誤り、審査で見つかった誤り。誤りを見つけても vanda は最後まで動き、知らせた後に終了コード 1 で終わることがある"

[[term]]
id = "error"
name = "エラー"
definition = "vanda や、vanda が呼んだもの（アダプタ・git・ストーリーの置き場所など）が、処理を続けられずに失敗すること。0 以外の終了コードや、API の 4xx・5xx で返す。例: アダプタが 0 以外で終わった、GitHub に繋がらない"

[[term]]
id = "flag"
name = "フラグ"
definition = "注意して読む手がかりとして、約束などに立てるもの。AI 案・推測・差分ありの 3 種類。約束リストの項目 flags に書けるのは ai-proposal（AI 案）だけ。推測と差分ありは vanda が立てる。推測は項目 guesses を書いた約束に、差分ありは前に合意したことがあって今は提案中のものに立てる"

[[term]]
id = "annotation"
name = "アノテーション"
definition = "仕様・テスト・本番のコードに書く注釈。約束などの ID を指す（例: @vanda:evidence <約束の ID>）"

[[term]]
id = "adapter"
name = "アダプタ"
definition = "vanda と、言語や道具・ストーリーの置き場所・ガードレールの定義とのあいだで受け渡しをする部品。vanda が組込みで持つもの（組込みのアダプタ）と、プロジェクトが .vanda/adapters/ に置くものがある"

[[term]]
id = "builtin-adapter"
name = "組込みのアダプタ"
definition = "vanda が中に持つアダプタ（アノテーションの go・txtar・tla・sql・ts、ストーリーの置き場所の github、ガードレールの定義の file）。アノテーションとストーリーの置き場所では、同じ名前のアダプタを .vanda/adapters/ に置くと、そちらが使われる"
part_of = "adapter"

[[term]]
id = "custom-adapter"
name = "カスタムアダプタ"
definition = "利用者が .vanda/adapters/ に置いたアダプタ。設定に書いた名前で、vanda が動かす"
part_of = "adapter"

[[term]]
id = "fingerprint"
name = "指紋"
definition = "中身が同じかを比べるための値。合意の記録は、合意した時の指紋を持つ"

[[term]]
id = "story-trailer"
name = "Story: のトレーラー"
definition = "コミットのメッセージの末尾に書く Story: <ID>（Co-Authored-By: と同じ Git のトレーラー）。そのコミットがどのストーリーのものかを表す。1 つのコミットに 1 つまで"

[[term]]
id = "check-config"
name = "審査の設定"
definition = "どの審査を、どの範囲で行うかを書いたファイル（.vanda/checks/<名前>.toml）。vanda check に渡す"

[[term]]
id = "check-scope"
name = "範囲"
definition = "審査が見るもの。all（全部）か story（1 つのストーリーで変わったもの）"

[[term]]
id = "branch-point"
name = "分岐点"
definition = "今のブランチがベースブランチから分かれたコミット（git merge-base）。範囲 story の審査は、ここからの変化を見る"

[[term]]
id = "detached"
name = "外れた合意"
definition = "ストーリーが合意したことがあり、今の中身にそのストーリーの合意がないもの。誰が変えたかを問わない"

[[term]]
id = "evidence-plan"
name = "エビデンスの予定"
definition = "約束ごとに、どのステージで、どのタイプのエビデンスを、どのレイヤーで得るかを書いたもの（約束リストの項目は evidence）"

[[feature]]
id = "start-server"
name = "vanda サーバーを起動する（vanda serve）"
definition = "vanda サーバーを起動し、画面をブラウザで開く"

[[feature]]
id = "read-promise-list"
name = "約束リストを読む"
definition = "約束リスト（設定の promises のパターンに当たるファイル）を読み、形を確かめる"

[[feature]]
id = "store-agreements"
name = "合意の記録を読み書きする"
definition = "約束リストとは別のファイルの合意の記録を読み書きする。合意ごとに、中身の指紋・日時・ストーリーの ID・合意した人を持つ"

[[feature]]
id = "build-origins"
name = "由来を作る"
definition = "git の履歴から、約束ごとの由来（約束が作られたり変わったりしたコミット）を作る"

[[feature]]
id = "choose-base-branch"
name = "ベースブランチを選ぶ"
definition = "比べるベースブランチを、画面でその場で選ぶ。開いた時の既定は設定のベースブランチ"

[[feature]]
id = "connect-story-store"
name = "ストーリーの置き場所と連携する"
definition = "ストーリーの置き場所から、ストーリーの題・本文・添付ファイルを読む。置き場所はアダプタで差し替えられる"

[[feature]]
id = "store-config"
name = "設定をファイルに書く"
definition = "設定を .vanda/config.toml に持つ。画面で書き換える機能は作らない。認証キーはファイルに書かない"

[[feature]]
id = "list-changes"
name = "ストーリーで変わったものを並べる"
definition = "比べる元と今のあいだで追加・変更・削除された約束・用語・機能とエビデンスの本体の一覧を、漏れも重複もなく示す"

[[feature]]
id = "number-changes"
name = "通し番号と総数を示す"
definition = "一覧に通し番号と総数を示す"

[[feature]]
id = "raise-flags"
name = "フラグを立てる"
definition = "注意して読む手がかりとして、AI 案・推測・差分ありのフラグを立てる"

[[feature]]
id = "compare-contents"
name = "変更前と変更後の中身を比べる"
definition = "変更・削除したものの、変更前と変更後の中身と差分を示す"

[[feature]]
id = "agree-on-review"
name = "合意する"
definition = "1 件に合意し、合意の記録を書いてコミットする"
core = true
formal = true

[[feature]]
id = "show-evidence-status"
name = "エビデンスの予定と実際を示す"
definition = "エビデンスの予定ごとに、揃っているかを示す"

[[feature]]
id = "fold-groups"
name = "長い一覧をたたむ"
definition = "一覧をまとまりごとにたたみ、たたんだ件数を示す"

[[feature]]
id = "switch-review-unit"
name = "レビュー単位を切り替える"
definition = "レビュー単位をブランチとストーリーで切り替える"

[[feature]]
id = "show-detached"
name = "外れた合意を示す"
definition = "ストーリーが前に合意したのに今の中身にそのストーリーの合意がないものを、「合意が外れた」と示す"

[[feature]]
id = "show-entry-history"
name = "1 件の詳細に由来と合意の履歴を示す"
definition = "レビューの 1 件の詳細に、約束の由来と合意の履歴を示す"

[[feature]]
id = "revoke-agreement"
name = "合意を取り消す"
definition = "今の利用者（今の git の user.name と user.email の人）が今のブランチで書いた合意の記録を消し、コミットする"
core = true
formal = true

[[feature]]
id = "agree-on-detail-pages"
name = "約束の詳細とファイルの画面で合意する"
definition = "約束の詳細の画面と、ファイルの画面でも、合意する・合意を取り消す"

[[feature]]
id = "show-claim-fields"
name = "約束の文・理由・条件・レイヤーを示す"
definition = "約束の詳細に、文・理由・条件・レイヤーを示す"

[[feature]]
id = "show-claim-evidence"
name = "約束のエビデンスを示す"
definition = "約束の詳細に、エビデンスをステージとタイプで分けて、その中身とともに示す"

[[feature]]
id = "show-claim-origin"
name = "約束の由来を示す"
definition = "約束の詳細に、由来を示す"

[[feature]]
id = "show-claim-agreements"
name = "約束の合意の履歴を示す"
definition = "約束の詳細に、合意の履歴を示す"

[[feature]]
id = "render-tla-symbols"
name = "TLA+ を数学の記号で見せる"
definition = "オラクルの定義（TLA+）を数学の記号で見せ、コピーした時はリポジトリの文字のままにする"

[[feature]]
id = "show-claim-at-commit"
name = "その時点の約束の中身を示す"
definition = "由来のコミットや合意の記録を選ぶと、その時点の約束の中身を示す"

[[feature]]
id = "diagnose-setup"
name = "設定とつながりを確かめる（vanda doctor）"
definition = "今効いている設定と版と、ストーリーの置き場所につながるかを確かめる"

[[feature]]
id = "run-checks"
name = "審査を行う（vanda check）"
definition = "審査の設定のファイルに並べた審査を行う"

[[feature]]
id = "list-check-kinds"
name = "審査を列挙する"
definition = "vanda check で行える審査の種類を用意する。どの種類があるかは、用語「審査」の一部として並べる"

[[feature]]
id = "create-vanda-dir"
name = ".vanda/ を作る（vanda init）"
definition = "端末で問いかけ、答えで設定・約束リスト・合意の記録・審査の設定を作る"

[[feature]]
id = "show-version"
name = "版を出す（vanda version）"
definition = "動いている vanda の版を出す"

[[feature]]
id = "read-annotations"
name = "アノテーションを読み取る"
definition = "設定のパターンに当たるファイルから、アダプタでアノテーションと、付いているものの名前を読む"

[[feature]]
id = "run-custom-adapters"
name = "カスタムアダプタを動かす"
definition = "プロジェクトが .vanda/adapters/ に置いたアダプタを、設定に書いた名前で動かす"

[[claim]]
id = "promise-list-reads-all-patterns"
subjects = ["read-promise-list", "promise-list"]
statement = "設定の promises のパターンに当たるファイルを、すべて約束リストとして読む"
layers = ["cli"]
flags = ["ai-proposal"]

[[claim.evidence]]
stage = "test"
type = "unit-test"
layers = ["cli"]

[[claim.evidence]]
stage = "test"
type = "interface-test"
layers = ["cli"]

[[claim.evidence]]
stage = "test"
type = "scenario-test"
layers = ["cli"]

[[claim]]
id = "reads-committed-files-only"
subjects = ["run-checks", "list-changes", "check"]
statement = "審査とレビューの画面は、設定・約束リスト・合意の記録のファイルと、アノテーションを読むファイルを、HEAD のコミットの中身で読む。コミットしていないファイルと変更（git add したものを含む）は読まない"
rationale = "コミットしていないものは、提出される保証がなく、ないのと同じため。手元と CI で結果が変わらないようにする"
layers = ["cli", "api"]
flags = ["ai-proposal"]

[[claim.evidence]]
stage = "test"
type = "unit-test"
layers = ["cli"]

[[claim.evidence]]
stage = "test"
type = "scenario-test"
layers = ["cli"]

[[claim.evidence]]
stage = "test"
type = "unit-test"
layers = ["api"]

[[claim]]
id = "promise-list-default-file-may-be-absent"
subjects = ["read-promise-list", "promise-list"]
statement = "設定に promises を書かず、既定の .vanda/promises.toml がなければ、空の約束リストとみなす"
layers = ["cli"]
flags = ["ai-proposal"]

[[claim.evidence]]
stage = "test"
type = "unit-test"
layers = ["cli"]

[[claim]]
id = "promise-list-explicit-file-must-exist"
